<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>SMEAG 관리자 — 신규 화면 프로토타입</title>
<style>
  :root{
    --bg:#eef1f2; --surface:#ffffff; --surface-2:#f4f6f7; --border:#dbe2e4;
    --text:#17242b; --dim:#5c6d74; --faint:#85959c;
    --accent:#0f766e; --accent-weak:#d6ede9; --accent-ink:#0b5751;
    --male:#2563eb; --female:#e11d48; --family:#d97706; --empty:#aab6bc;
    --good:#15803d; --warn:#b45309; --neutral:#64748b; --return:#7c3aed; --install:#0891b2;
    --shadow:0 1px 2px rgba(20,40,50,.06),0 2px 8px rgba(20,40,50,.05);
    --c-enc:#0f766e; --c-cla:#4f46e5; --c-cap:#0e7490;
    --r:10px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0d1417; --surface:#141e22; --surface-2:#1a262b; --border:#2a393f;
      --text:#e7edef; --dim:#93a4ab; --faint:#6c7d84;
      --accent:#2dd4bf; --accent-weak:#123b38; --accent-ink:#9defe4;
      --male:#60a5fa; --female:#fb7185; --family:#fbbf24; --empty:#3a4a51;
      --good:#4ade80; --warn:#fbbf24; --neutral:#94a3b8; --return:#a78bfa; --install:#38bdf8;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
      --c-enc:#2dd4bf; --c-cla:#818cf8; --c-cap:#22d3ee;
    }
  }
  :root[data-theme="light"]{
    --bg:#eef1f2; --surface:#ffffff; --surface-2:#f4f6f7; --border:#dbe2e4;
    --text:#17242b; --dim:#5c6d74; --accent:#0f766e; --accent-weak:#d6ede9; --accent-ink:#0b5751;
    --male:#2563eb; --female:#e11d48; --family:#d97706; --empty:#aab6bc;
    --good:#15803d; --warn:#b45309; --neutral:#64748b; --return:#7c3aed; --install:#0891b2;
    --c-enc:#0f766e; --c-cla:#4f46e5; --c-cap:#0e7490;
  }
  :root[data-theme="dark"]{
    --bg:#0d1417; --surface:#141e22; --surface-2:#1a262b; --border:#2a393f;
    --text:#e7edef; --dim:#93a4ab; --accent:#2dd4bf; --accent-weak:#123b38; --accent-ink:#9defe4;
    --male:#60a5fa; --female:#fb7185; --family:#fbbf24; --empty:#3a4a51;
    --good:#4ade80; --warn:#fbbf24; --neutral:#94a3b8; --return:#a78bfa; --install:#38bdf8;
    --c-enc:#2dd4bf; --c-cla:#818cf8; --c-cap:#22d3ee;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
  .app{display:grid;grid-template-columns:236px 1fr;grid-template-rows:auto 1fr;
    grid-template-areas:"top top" "side main";min-height:100vh}

  /* TOPBAR */
  .top{grid-area:top;display:flex;align-items:center;gap:18px;padding:0 18px;height:56px;
    background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
  .brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--c-cap));
    display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900}
  .brand small{font-weight:600;color:var(--dim);font-size:11px;letter-spacing:.4px}
  .cats{display:flex;gap:4px;margin-left:6px}
  .cat{border:0;background:transparent;color:var(--dim);font:inherit;font-weight:650;cursor:pointer;
    padding:8px 14px;border-radius:8px;display:flex;align-items:center;gap:7px}
  .cat:hover{background:var(--surface-2);color:var(--text)}
  .cat.active{background:var(--accent-weak);color:var(--accent-ink)}
  .cat .ic{font-size:15px}
  .top .spacer{flex:1}
  .campus-sel{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:8px;padding:5px 10px}
  .campus-sel label{font-size:11px;color:var(--dim);font-weight:600}
  .campus-sel select{border:0;background:transparent;color:var(--text);font:inherit;font-weight:650;cursor:pointer}
  .who{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px}
  .who .av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
  .theme-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--dim);border-radius:8px;
    width:32px;height:32px;cursor:pointer;font-size:14px}

  /* SIDEBAR */
  .side{grid-area:side;background:var(--surface);border-right:1px solid var(--border);
    padding:12px 10px;overflow-y:auto;max-height:calc(100vh - 56px);position:sticky;top:56px}
  .side-title{font-size:11px;font-weight:750;letter-spacing:.6px;color:var(--faint);text-transform:uppercase;
    padding:8px 10px 6px}
  .nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--dim);
    text-decoration:none;font-size:13px;cursor:pointer;margin-bottom:1px}
  .nav a:hover{background:var(--surface-2);color:var(--text)}
  .nav a.active{background:var(--accent-weak);color:var(--accent-ink);font-weight:700}
  .nav a .dot{width:5px;height:5px;border-radius:50%;background:var(--empty);flex:none}
  .nav a.active .dot{background:var(--accent)}
  .nav a .tag{margin-left:auto;font-size:10px;color:var(--faint);font-weight:600}
  .nav .grp{margin-top:10px}

  /* MAIN */
  .main{grid-area:main;padding:20px 24px 60px;overflow-x:hidden;max-width:1200px}
  .ph{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .ph h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.2px}
  .ph .sub{color:var(--dim);font-size:12.5px}
  .ph .url{margin-left:auto;font-size:11.5px;color:var(--faint)}
  .ph .actions{display:flex;gap:8px}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-weight:650;
    padding:7px 13px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:var(--surface-2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .btn .spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
    animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.btn .spin{animation:none}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:16px}

  /* filter bar */
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px}
  .field{display:flex;flex-direction:column;gap:3px}
  .field label{font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.3px;padding-left:2px}
  .field select,.field input{border:1px solid var(--border);background:var(--surface-2);color:var(--text);
    font:inherit;font-size:12.5px;padding:6px 9px;border-radius:7px;min-width:110px}
  .filters .grow{flex:1}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .chip{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);
    color:var(--dim);font-weight:650}
  .chip.on{background:var(--accent-weak);border-color:transparent;color:var(--accent-ink)}

  /* table */
  .twrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
  table.grid{border-collapse:collapse;width:100%;font-size:12.5px;min-width:640px}
  table.grid th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:9px 11px;
    font-size:10.5px;letter-spacing:.4px;color:var(--dim);text-transform:uppercase;font-weight:750;
    border-bottom:1px solid var(--border);white-space:nowrap}
  table.grid td{padding:9px 11px;border-bottom:1px solid var(--border);white-space:nowrap}
  table.grid tr:last-child td{border-bottom:0}
  table.grid tbody tr:hover{background:var(--surface-2)}
  td.num,th.num{text-align:right}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;
    background:var(--surface-2);color:var(--dim)}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.male{color:var(--male);background:color-mix(in srgb,var(--male) 14%,transparent)}
  .pill.female{color:var(--female);background:color-mix(in srgb,var(--female) 14%,transparent)}
  .pill.family{color:var(--family);background:color-mix(in srgb,var(--family) 14%,transparent)}
  .pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
  .pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
  .pill.install{color:var(--install);background:color-mix(in srgb,var(--install) 14%,transparent)}
  .pill.return{color:var(--return);background:color-mix(in srgb,var(--return) 14%,transparent)}
  .pill.neutral{color:var(--neutral);background:color-mix(in srgb,var(--neutral) 14%,transparent)}
  .cch{font-size:10.5px;font-weight:750;padding:2px 8px;border-radius:6px;letter-spacing:.3px}
  .cch.enc{color:#fff;background:var(--c-enc)} .cch.cla{color:#fff;background:var(--c-cla)} .cch.cap{color:#fff;background:var(--c-cap)}
  @media (prefers-color-scheme:dark){.cch{color:#08120f !important}}
  :root[data-theme="dark"] .cch{color:#08120f !important}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
  .kpi .k{font-size:11px;color:var(--dim);font-weight:650;letter-spacing:.2px}
  .kpi .v{font-size:26px;font-weight:820;letter-spacing:-.6px;margin-top:3px}
  .kpi .d{font-size:11px;margin-top:4px;color:var(--dim)}
  .kpi .d b{color:var(--good)}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
  .h3{font-size:13px;font-weight:750;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .h3 .mini{font-size:11px;color:var(--faint);font-weight:600}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12px}
  .bar-row .lb{width:78px;color:var(--dim)}
  .bar-track{flex:1;height:9px;background:var(--surface-2);border-radius:6px;overflow:hidden;display:block}
  .bar-fill{display:block;height:100%;border-radius:6px;min-width:2px}
  .bar-row .vv{width:52px;text-align:right;font-weight:700}
  .feed{display:flex;flex-direction:column;gap:2px}
  .feed .it{display:flex;gap:9px;padding:8px 4px;border-bottom:1px solid var(--border);font-size:12px;align-items:center}
  .feed .it:last-child{border-bottom:0}
  .feed .it .t{color:var(--faint);font-size:10.5px;width:44px;flex:none}
  .feed .it .m{color:var(--dim)}

  /* room grid */
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:12px;color:var(--dim)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .zone{margin-bottom:16px}
  .zone .zt{font-size:11px;font-weight:750;color:var(--dim);letter-spacing:.4px;margin:0 0 8px;text-transform:uppercase}
  .rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px}
  .room{border:1px solid var(--border);border-radius:9px;padding:9px;background:var(--surface);cursor:default;
    border-left:4px solid var(--empty);transition:transform .08s}
  .room:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .room.m{border-left-color:var(--male)} .room.f{border-left-color:var(--female)} .room.fam{border-left-color:var(--family)}
  .room .rn{font-weight:800;font-size:13px} .room .rc{font-size:10.5px;color:var(--dim);margin-top:2px}
  .room .rocc{font-size:10.5px;margin-top:5px;font-weight:700}
  .room.m .rocc{color:var(--male)} .room.f .rocc{color:var(--female)} .room.fam .rocc{color:var(--family)}
  .room.empty .rocc{color:var(--empty)}

  /* admission grid */
  .adm{overflow-x:auto}
  table.adm-t{border-collapse:collapse;width:100%;font-size:12px;min-width:560px}
  table.adm-t th,table.adm-t td{border:1px solid var(--border);padding:8px 10px;text-align:center}
  table.adm-t th{background:var(--surface-2);color:var(--dim);font-size:10.5px;text-transform:uppercase;font-weight:750}
  table.adm-t td .av{font-weight:750}
  .soon{color:var(--warn);font-weight:750}

  /* spec card (non-core screens) */
  .spec{display:grid;gap:14px}
  .spec .row{display:flex;gap:10px;flex-wrap:wrap}
  .spec .kv{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px}
  .spec .kv b{color:var(--dim);font-weight:700;margin-right:6px;font-size:11px}
  .colgrid{display:flex;gap:6px;flex-wrap:wrap}
  .colgrid .c{font-size:11.5px;background:var(--surface-2);border:1px solid var(--border);padding:4px 9px;border-radius:6px;font-weight:600}
  .note{background:var(--accent-weak);color:var(--accent-ink);border-radius:8px;padding:10px 13px;font-size:12.5px}

  /* toast */
  .toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--warn);
    box-shadow:var(--shadow);border-radius:9px;padding:11px 14px;font-size:12.5px;max-width:320px;
    animation:pop .2s ease}
  .toast.ok{border-left-color:var(--good)}
  .toast b{display:block;margin-bottom:2px}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .banner{font-size:11px;color:var(--faint);text-align:center;padding:10px;border-top:1px solid var(--border);margin-top:20px}
  @media (max-width:880px){
    .app{grid-template-columns:1fr;grid-template-areas:"top" "main"}
    .side{display:none} .cats{display:none} .kpis{grid-template-columns:repeat(2,1fr)} .grid2{grid-template-columns:1fr}
  }
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span class="logo">S</span> SMEAG <small>ADMIN · 신규</small></div>
    <nav class="cats" id="cats"></nav>
    <div class="spacer"></div>
    <div class="campus-sel">
      <label>캠퍼스</label>
      <select id="campus">
        <option value="all">ALL</option>
        <option value="1">ENCANTO</option>
        <option value="4">CLASSIC</option>
        <option value="5">CAPITAL</option>
      </select>
    </div>
    <button class="theme-btn" id="themeBtn" title="테마 전환">◐</button>
    <div class="who"><span class="av">K</span><span>kenneth</span></div>
  </header>

  <aside class="side">
    <div class="side-title" id="sideTitle">STUDENT'S</div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main" id="main"></main>
</div>
<div class="toasts" id="toasts"></div>

<script>
// ─── 메뉴 모델 (크롤 실측 반영) ───
const CATS=[
  {id:'record',icon:'⌂',label:'Record'},
  {id:'student',icon:'👤',label:"Student's"},
  {id:'dorm',icon:'🏠',label:'Dormitory'},
  {id:'cash',icon:'💳',label:'Cash Cards'},
];
const MENU={
  record:[{k:'dash',t:'대시보드',u:'(신규 승격)',tag:'HOME'}],
  student:[
    {k:'stdlist',t:'STUDENT LIST',u:'student.php'},
    {k:'enroll',t:'수강등록관리',u:'student_list.php',tag:'90,533'},
    {k:'spec',t:'멀티수강관리',u:'student_list3.php',tag:'8,308',cols:['유학원명','국적','이름(영문)','이름','나이','성별','등록일','출발일','시작일','종료일','기간','상태','코스시작일','연수코스','객실']},
    {k:'spec',t:'MC Report 1',u:'student_list3_en1.php',cols:['Num','Campus','Course','Start','End','Week','Info','ID']},
    {k:'spec',t:'MC Report 2',u:'student_list3_en2.php',note:'코스×주차 매트릭스'},
    {k:'spec',t:'Graduate',u:'student_list3_en3.php',cols:['Num','Campus','Name','Gender','Nation','Start','End','Week','Info','ID']},
    {k:'spec',t:'APPLY LIST',u:'student_list2.php',cols:['AGENCY','NAT','NAME','KOR','BIRTH','AGE','SEX','APPLY','DEPA','BEGIN','PICKUP','END','PERI','COND','COURSE','DORM','COUNSEL','HEALTH','PA','O.S.']},

    {k:'spec',t:'수금관리',u:'student_list_pay.php',tag:'90,533',cols:['유학원','국적','이름','나이','성별','수금방법','상태','기간','객실'],note:'pay_channel: center/account'},
    {k:'deposit',t:'DEPOSIT',u:'student_payment.php'},
    {k:'spec',t:'Deposit(test)',u:'student_payment-2.php',cols:['Deposit #','NAT','eNAME','CAMPUS','STATUS','DEPOSIT','UNIT','DATE']},
    {k:'spec',t:'FARM & GYM',u:'student_farm.php',cols:['NAT','NAME','GYM START','GYM PERIOD','FARM ARRIVAL','FARM FLIGHT','COMMENTS','COMMISSION','APPLY']},
    {k:'spec',t:'GYM 리포트',u:'student_gym.php',cols:['NAT','NAME','GYM START','GYM PERIOD','GYM FEE','COMMISSION','APPLY','CAMPUS']},
    {k:'spec',t:'FARM 리포트',u:'student_farm2.php',cols:['NAT','NAME','FARM ARRIVAL','PAID','FARM FEE','COMMISSION','APPLY','CAMPUS']},
    {k:'spec',t:'POPULATION',u:'student_population.php',note:'국적×캠퍼스(ENCANTO/CLASSIC/CAPITAL/TOTAL) 교차표'},
    {k:'spec',t:'POPULATION2',u:'student_population2.php',note:'인구통계 변형뷰'},
    {k:'spec',t:'STDNT STATUS',u:'student_present2.php',note:'센터×국적×일자 매트릭스(인원·%)'},
    {k:'spec',t:'STDNT Fullsize/Encanto/Classic/Capital',u:'student_present2-*.php',note:'⚠ 4종 모두 홈(/) 리다이렉트 = 외부 에이전시 포털(관리기능 아님)'},
    {k:'spec',t:'REGISTER STATS',u:'student_register.php',note:'신규등록 통계(fsearch)'},
    {k:'spec',t:'GAC BOARD',u:'bbs/board.php?bo_table=office_GAC',cols:['NO','TITLE','WRITER','DATE','VIEW']},
    {k:'spec',t:'Campus Holding',u:'bbs/board.php?bo_table=office_holding',cols:['NO','TITLE','WRITER','DATE','VIEW']},
  ],
  dorm:[
    {k:'spec',t:'DORM SEARCH',u:'room_search2.php',cols:['GROUP','ROOM NUMBER','BED NUMBER','PER/ROOM(인실)','SEX','CENTER'],note:'r_limit 1~5, s_gender M/F'},

  const cf=document.getElementById('cf1');if(cf)cf.textContent=document.getElementById('campus').selectedOptions[0].text;
  m.querySelectorAll('[data-guard]').forEach(b=>b.addEventListener('click',()=>guard(b)));
  m.scrollIntoView({block:'start'});}
function renderAll(){if(!curMenu)curMenu=MENU[curCat][0];renderCats();renderNav();renderMain();}

// ─── 중복실행 방지(idempotency) 데모 ───
const running={};
function guard(btn){const kind=btn.dataset.guard;
  if(running[kind]){toast('이미 실행 중입니다',`${kind==='invoice'?'인보이스 발행':'저장'}이 진행 중입니다. 중복 요청이 차단되었습니다 (멱등키 재사용 → 중복 레코드 미생성).`,false);return;}
  running[kind]=true;const orig=btn.innerHTML;btn.disabled=true;btn.innerHTML=`<span class="spin"></span> 처리 중…`;
  setTimeout(()=>{running[kind]=false;btn.disabled=false;btn.innerHTML=orig;
    toast(kind==='invoice'?'인보이스 발행 완료':'저장 완료',`멱등키 확정 · 중복 없이 1건 처리되었습니다.`,true);},1800);}
function toast(title,msg,ok){const t=document.getElementById('toasts');const d=el('div','toast'+(ok?' ok':''),`<b>${title}</b>${msg}`);
  t.appendChild(d);setTimeout(()=>{d.style.opacity=0;setTimeout(()=>d.remove(),300);},ok?2600:3400);}

// 캠퍼스 필터 → 칩 갱신
document.getElementById('campus').addEventListener('change',()=>{const cf=document.getElementById('cf1');if(cf)cf.textContent=document.getElementById('campus').selectedOptions[0].text;});
// 테마 토글
document.getElementById('themeBtn').addEventListener('click',()=>{
  const r=document.documentElement;const cur=r.getAttribute('data-theme');
  const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.setAttribute('data-theme',dark?'light':'dark');});

renderAll();
</script>
