<title>SMEAG 관리자 — 신규 화면 프로토타입</title>
<style>
  :root{
    --bg:#eef1f2; --surface:#ffffff; --surface-2:#f4f6f7; --border:#dbe2e4;
    --text:#17242b; --dim:#5c6d74; --faint:#85959c;
    --accent:#0f766e; --accent-weak:#d6ede9; --accent-ink:#0b5751;
    --male:#2563eb; --female:#e11d48; --family:#d97706; --empty:#aab6bc;
    --good:#15803d; --warn:#b45309; --neutral:#64748b; --return:#7c3aed; --install:#0891b2;
    --shadow:0 1px 2px rgba(20,40,50,.06),0 2px 8px rgba(20,40,50,.05);
    --c-enc:#0f766e; --c-cla:#4f46e5; --c-cap:#0e7490;
    --r:10px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0d1417; --surface:#141e22; --surface-2:#1a262b; --border:#2a393f;
      --text:#e7edef; --dim:#93a4ab; --faint:#6c7d84;
      --accent:#2dd4bf; --accent-weak:#123b38; --accent-ink:#9defe4;
      --male:#60a5fa; --female:#fb7185; --family:#fbbf24; --empty:#3a4a51;
      --good:#4ade80; --warn:#fbbf24; --neutral:#94a3b8; --return:#a78bfa; --install:#38bdf8;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
      --c-enc:#2dd4bf; --c-cla:#818cf8; --c-cap:#22d3ee;
    }
  }
  :root[data-theme="light"]{
    --bg:#eef1f2; --surface:#ffffff; --surface-2:#f4f6f7; --border:#dbe2e4;
    --text:#17242b; --dim:#5c6d74; --accent:#0f766e; --accent-weak:#d6ede9; --accent-ink:#0b5751;
    --male:#2563eb; --female:#e11d48; --family:#d97706; --empty:#aab6bc;
    --good:#15803d; --warn:#b45309; --neutral:#64748b; --return:#7c3aed; --install:#0891b2;
    --c-enc:#0f766e; --c-cla:#4f46e5; --c-cap:#0e7490;
  }
  :root[data-theme="dark"]{
    --bg:#0d1417; --surface:#141e22; --surface-2:#1a262b; --border:#2a393f;
    --text:#e7edef; --dim:#93a4ab; --accent:#2dd4bf; --accent-weak:#123b38; --accent-ink:#9defe4;
    --male:#60a5fa; --female:#fb7185; --family:#fbbf24; --empty:#3a4a51;
    --good:#4ade80; --warn:#fbbf24; --neutral:#94a3b8; --return:#a78bfa; --install:#38bdf8;
    --c-enc:#2dd4bf; --c-cla:#818cf8; --c-cap:#22d3ee;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
  .app{display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;
    grid-template-areas:"top" "main";min-height:100vh}

  /* TOPBAR */
  .top{grid-area:top;display:flex;align-items:center;gap:18px;padding:0 18px;height:56px;
    background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
  .brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--c-cap));
    display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900}
  .brand small{font-weight:600;color:var(--dim);font-size:11px;letter-spacing:.4px}
  .cats{display:flex;gap:4px;margin-left:6px}
  .cat{border:0;background:transparent;color:var(--dim);font:inherit;font-weight:650;cursor:pointer;
    padding:8px 14px;border-radius:8px;display:flex;align-items:center;gap:7px}
  .cat:hover{background:var(--surface-2);color:var(--text)}
  .cat.active{background:var(--accent-weak);color:var(--accent-ink)}
  .cat .ic{font-size:15px}
  .top .spacer{flex:1}
  .campus-sel{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:8px;padding:5px 10px}
  .campus-sel label{font-size:11px;color:var(--dim);font-weight:600}
  .campus-sel select{border:0;background:transparent;color:var(--text);font:inherit;font-weight:650;cursor:pointer}
  .who{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px}
  .who .av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
  .theme-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--dim);border-radius:8px;
    width:32px;height:32px;cursor:pointer;font-size:14px}

  /* 탑다운 드롭다운 네비 (상단 카테고리 아래로 펼침) */
  .catwrap{position:relative}
  .cat .caret{font-size:10px;opacity:.6;margin-left:2px}
  .dropdown{position:absolute;top:calc(100% + 8px);left:0;background:var(--surface);
    border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);padding:7px;
    min-width:250px;max-height:74vh;overflow-y:auto;z-index:40;display:none}
  .dropdown.open{display:block}
  .dd-title{font-size:10.5px;font-weight:750;letter-spacing:.5px;color:var(--faint);
    text-transform:uppercase;padding:5px 10px 7px}
  .dropdown a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;
    color:var(--dim);text-decoration:none;font-size:13px;cursor:pointer;margin-bottom:1px}
  .dropdown a:hover{background:var(--surface-2);color:var(--text)}
  .dropdown a.active{background:var(--accent-weak);color:var(--accent-ink);font-weight:700}
  .dropdown a .dot{width:5px;height:5px;border-radius:50%;background:var(--empty);flex:none}
  .dropdown a.active .dot{background:var(--accent)}
  .dropdown a .tag{margin-left:auto;font-size:10px;color:var(--faint);font-weight:600}

  /* MAIN */
  .main{grid-area:main;padding:18px 24px 40px;overflow-x:hidden}
  .ph{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .ph h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.2px}
  .ph .sub{color:var(--dim);font-size:12.5px}
  .ph .url{margin-left:auto;font-size:11.5px;color:var(--faint)}
  .ph .actions{display:flex;gap:8px}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-weight:650;
    padding:7px 13px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:var(--surface-2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .btn .spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
    animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.btn .spin{animation:none}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:16px}

  /* filter bar */
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px}
  .field{display:flex;flex-direction:column;gap:3px}
  .field label{font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.3px;padding-left:2px}
  .field select,.field input{border:1px solid var(--border);background:var(--surface-2);color:var(--text);
    font:inherit;font-size:12.5px;padding:6px 9px;border-radius:7px;min-width:110px}
  .filters .grow{flex:1}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .chip{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);
    color:var(--dim);font-weight:650}
  .chip.on{background:var(--accent-weak);border-color:transparent;color:var(--accent-ink)}

  /* table */
  .twrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
  table.grid{border-collapse:collapse;width:100%;font-size:12.5px;min-width:640px}
  table.grid th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:9px 11px;
    font-size:10.5px;letter-spacing:.4px;color:var(--dim);text-transform:uppercase;font-weight:750;
    border-bottom:1px solid var(--border);white-space:nowrap}
  table.grid td{padding:9px 11px;border-bottom:1px solid var(--border);white-space:nowrap}
  table.grid tr:last-child td{border-bottom:0}
  table.grid tbody tr:hover{background:var(--surface-2)}
  td.num,th.num{text-align:right}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;
    background:var(--surface-2);color:var(--dim)}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.male{color:var(--male);background:color-mix(in srgb,var(--male) 14%,transparent)}
  .pill.female{color:var(--female);background:color-mix(in srgb,var(--female) 14%,transparent)}
  .pill.family{color:var(--family);background:color-mix(in srgb,var(--family) 14%,transparent)}
  .pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
  .pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
  .pill.install{color:var(--install);background:color-mix(in srgb,var(--install) 14%,transparent)}
  .pill.return{color:var(--return);background:color-mix(in srgb,var(--return) 14%,transparent)}
  .pill.neutral{color:var(--neutral);background:color-mix(in srgb,var(--neutral) 14%,transparent)}
  .cch{font-size:10.5px;font-weight:750;padding:2px 8px;border-radius:6px;letter-spacing:.3px}
  .cch.enc{color:#fff;background:var(--c-enc)} .cch.cla{color:#fff;background:var(--c-cla)} .cch.cap{color:#fff;background:var(--c-cap)}
  @media (prefers-color-scheme:dark){.cch{color:#08120f !important}}
  :root[data-theme="dark"] .cch{color:#08120f !important}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
  .kpi .k{font-size:11px;color:var(--dim);font-weight:650;letter-spacing:.2px}
  .kpi .v{font-size:26px;font-weight:820;letter-spacing:-.6px;margin-top:3px}
  .kpi .d{font-size:11px;margin-top:4px;color:var(--dim)}
  .kpi .d b{color:var(--good)}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
  .h3{font-size:13px;font-weight:750;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .h3 .mini{font-size:11px;color:var(--faint);font-weight:600}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12px}
  .bar-row .lb{width:78px;color:var(--dim)}
  .bar-track{flex:1;height:9px;background:var(--surface-2);border-radius:6px;overflow:hidden;display:block}
  .bar-fill{display:block;height:100%;border-radius:6px;min-width:2px}
  .bar-row .vv{width:52px;text-align:right;font-weight:700}
  .feed{display:flex;flex-direction:column;gap:2px}
  .feed .it{display:flex;gap:9px;padding:8px 4px;border-bottom:1px solid var(--border);font-size:12px;align-items:center}
  .feed .it:last-child{border-bottom:0}
  .feed .it .t{color:var(--faint);font-size:10.5px;width:44px;flex:none}
  .feed .it .m{color:var(--dim)}

  /* room grid */
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:12px;color:var(--dim)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .zone{margin-bottom:16px}
  .zone .zt{font-size:11px;font-weight:750;color:var(--dim);letter-spacing:.4px;margin:0 0 8px;text-transform:uppercase}
  .rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px}
  .room{border:1px solid var(--border);border-radius:9px;padding:9px;background:var(--surface);cursor:default;
    border-left:4px solid var(--empty);transition:transform .08s}
  .room:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .room.m{border-left-color:var(--male)} .room.f{border-left-color:var(--female)} .room.fam{border-left-color:var(--family)}
  .room .rn{font-weight:800;font-size:13px} .room .rc{font-size:10.5px;color:var(--dim);margin-top:2px}
  .room .rocc{font-size:10.5px;margin-top:5px;font-weight:700}
  .room.m .rocc{color:var(--male)} .room.f .rocc{color:var(--female)} .room.fam .rocc{color:var(--family)}
  .room.empty .rocc{color:var(--empty)}

  /* dorm occupancy gantt (room_stat3) — 대용량 대비 (틀고정 + 월점프 + content-visibility) */
  .dorm-actions{display:flex;gap:8px;flex-wrap:wrap}
  .dorm-actions .btn{font-size:11.5px;padding:6px 11px}
  .dorm-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
  .state-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
  .state-legend span{display:inline-flex;align-items:center;gap:6px}
  .state-legend i{width:15px;height:15px;border-radius:3px;display:inline-grid;place-items:center;font-size:9px;font-weight:800;color:#fff;flex:none}
  .month-jump{margin-left:auto;display:flex;gap:5px;overflow-x:auto;max-width:60%;padding-bottom:2px}
  .month-jump .btn{padding:5px 9px;font-size:11px;flex:none}
  .month-jump .btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .gantt thead th.mon-cur{background:var(--accent-weak);color:var(--accent-ink)}

  table.gantt{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:11px;background:var(--surface)}
  table.gantt th,table.gantt td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);overflow:hidden}
  table.gantt thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--dim);font-weight:750;padding:5px 4px;text-align:center;white-space:nowrap}
  table.gantt thead th.mon{font-size:12px;color:var(--text)}
  .gantt .dh{font-size:10px;padding:4px 0}
  .gantt td.dcell{height:26px;text-align:center;font-weight:700;font-size:10px;color:var(--faint);padding:0;cursor:pointer}
  .gantt td.dcell:hover{outline:2px solid var(--accent);outline-offset:-2px}
  /* 셀 액션 팝업 (입실/퇴실/방배정/방변경 등) */
  .cellpop{position:absolute;z-index:60;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:172px}
  .cellpop .cp-h{font-size:10.5px;color:var(--faint);font-weight:700;padding:4px 8px 7px;
    border-bottom:1px solid var(--border);margin-bottom:4px;white-space:nowrap}
  .cellpop .cp-h b{color:var(--text);font-weight:750}
  .cellpop button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;
    color:var(--text);font:inherit;font-size:12.5px;padding:7px 9px;border-radius:7px;cursor:pointer;text-align:left}
  .cellpop button:hover{background:var(--surface-2)}
  .cellpop button i{width:12px;height:12px;border-radius:3px;flex:none}
  .gantt td.info{padding:5px 9px;text-align:left;background:var(--surface);white-space:nowrap;text-overflow:ellipsis}
  .gantt td.rno{font-weight:800;text-align:center}
  .gantt .per{display:inline-block;color:#fff;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:750}
  .gantt .per.m{background:var(--male)} .gantt .per.f{background:var(--female)} .gantt .per.fam{background:#ca8a04}
  .gantt td.name{color:var(--return);text-overflow:ellipsis}
  .gantt td.cx{color:var(--faint)}
  .gantt td.cin{background:var(--good);color:#fff}
  .gantt td.cout{background:var(--female);color:#fff}
  .gantt td.chold{background:color-mix(in srgb,var(--return) 60%,var(--surface));color:#fff}
  .gantt td.cempty{background:var(--surface)}
  /* 틀고정: 좌측 3열 (방번호/인실/이름) */
  .gantt .c1{position:sticky;left:0;z-index:1}
  .gantt .c2{position:sticky;left:72px;z-index:1}
  .gantt .c3{position:sticky;left:130px;z-index:1}
  .gantt thead .c1,.gantt thead .c2,.gantt thead .c3{z-index:3}
  .gantt td.c1,.gantt td.c2,.gantt td.c3{background:var(--surface)}
  /* 구분 그룹 구분행 (rowspan 제거 대체) */
  .gantt tbody.grp-head td{background:var(--surface-2);border-bottom:2px solid var(--border);padding:0}
  .gantt .grp-label{position:sticky;left:0;display:inline-block;padding:7px 12px;font-weight:800;letter-spacing:.4px;color:var(--text)}
  /* 방 단위 블록: content-visibility로 화면 밖 행 렌더 스킵 (네이티브 가상화) */
  .gantt tbody.room-block{content-visibility:auto}
  .gantt tbody.room-block>tr>td{border-top:0}
  .gantt tbody.room-block>tr:first-child>td.info{border-top:2px solid var(--border)}
  .gantt tbody.room-block>tr:first-child>td.c1{box-shadow:inset 3px 0 0 var(--accent-weak)}
  /* 표 자체 스크롤 영역 → 세로로 내려가도 헤더/월버튼 고정, 월클릭 시 컬럼 가로스크롤 */
  .twrap.dorm-scroll{max-height:calc(100vh - 300px);overflow:auto}

  /* admission grid */
  .adm{overflow-x:auto}
  table.adm-t{border-collapse:collapse;width:100%;font-size:12px;min-width:560px}
  table.adm-t th,table.adm-t td{border:1px solid var(--border);padding:8px 10px;text-align:center}
  table.adm-t th{background:var(--surface-2);color:var(--dim);font-size:10.5px;text-transform:uppercase;font-weight:750}
  table.adm-t td .av{font-weight:750}
  .soon{color:var(--warn);font-weight:750}

  /* spec card (non-core screens) */
  .spec{display:grid;gap:14px}
  .spec .row{display:flex;gap:10px;flex-wrap:wrap}
  .spec .kv{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px}
  .spec .kv b{color:var(--dim);font-weight:700;margin-right:6px;font-size:11px}
  .colgrid{display:flex;gap:6px;flex-wrap:wrap}
  .colgrid .c{font-size:11.5px;background:var(--surface-2);border:1px solid var(--border);padding:4px 9px;border-radius:6px;font-weight:600}
  .note{background:var(--accent-weak);color:var(--accent-ink);border-radius:8px;padding:10px 13px;font-size:12.5px}

  /* toast */
  .toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--warn);
    box-shadow:var(--shadow);border-radius:9px;padding:11px 14px;font-size:12.5px;max-width:320px;
    animation:pop .2s ease}
  .toast.ok{border-left-color:var(--good)}
  .toast b{display:block;margin-bottom:2px}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .banner{font-size:11px;color:var(--faint);text-align:center;padding:10px;border-top:1px solid var(--border);margin-top:20px}
  @media (max-width:880px){
    .cats{display:none} .kpis{grid-template-columns:repeat(2,1fr)} .grid2{grid-template-columns:1fr}
  }
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span class="logo">S</span> SMEAG <small>ADMIN · 신규</small></div>
    <nav class="cats" id="cats"></nav>
    <div class="spacer"></div>
    <div class="campus-sel">
      <label>캠퍼스</label>
      <select id="campus">
        <option value="all">ALL</option>
        <option value="1">ENCANTO</option>
        <option value="4">CLASSIC</option>
        <option value="5">CAPITAL</option>
      </select>
    </div>
    <button class="theme-btn" id="themeBtn" title="테마 전환">◐</button>
    <div class="who"><span class="av">K</span><span>kenneth</span></div>
  </header>

  <main class="main" id="main"></main>
</div>

R.roomstat=()=>{
  const CELLW=22, INFOW=72+58+230; // 방번호+인실+이름 = 좌측 고정폭
  const pad=n=>String(n).padStart(2,'0');
  const daysIn=(y,m)=>new Date(y,m,0).getDate();
  // 선택월(roomCenter) 기준 ±6개월 = 13개월
  const months=[];
  for(let off=-6;off<=6;off++){let y=roomCenter.y,m=roomCenter.m+off;
    while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}months.push({y,m,days:daysIn(y,m),off});}
  const TOTAL=months.reduce((s,x)=>s+x.days,0);
  let daysBefore=0;for(let i=0;i<6;i++)daysBefore+=months[i].days; // 중심월 시작 오프셋(일)
  const centerStart=daysBefore*CELLW, centerWidth=months[6].days*CELLW;
  // 전체 날짜 라벨(셀 클릭 액션용)
  const dateLabels=[];months.forEach(mo=>{for(let d=1;d<=mo.days;d++)dateLabels.push(`${mo.y}-${pad(mo.m)}-${pad(d)}`);});

  const nm=(n)=>Array.from({length:n},fakeName).join(' - ');
  const c=daysBefore;
  function pat(kind){const a=Array(TOTAL).fill('x');const s=seed++;
    if(kind==='empty')return Array(TOTAL).fill('e');
    if(kind==='full'){if(s%3===0){a[c+3]='hold';a[c+4]='in';}if(s%5===0){a[c+24]='hold';a[c+25]='out';}return a;}
    if(kind==='latein'){const d=c+(2+s%6);for(let i=0;i<d;i++)a[i]='e';if(a[d]!==undefined)a[d]='in';return a;}
    if(kind==='earlyout'){const d=c+(12+s%10);for(let i=d+1;i<TOTAL;i++)a[i]='e';if(a[d]!==undefined)a[d]='out';return a;}
    if(kind==='gap'){const d1=c+(8+s%6),d2=d1+3;a[d1]='out';for(let i=d1+1;i<d2;i++)a[i]='e';if(a[d2]!==undefined)a[d2]='in';return a;}
    return a;}
  const KINDS=['full','full','latein','full','earlyout','full','gap','full','full','latein'];let ki=0;
  const nextKind=()=>KINDS[ki++%KINDS.length];

  const groups=[];
  // TEMPORARY — 공용(FAMILY), 1인실, 전실 공실
  {const rooms=[];for(let i=0;i<16;i++)rooms.push({no:(100+i)+'-temp',gender:'fam',per:'1인실',beds:[{name:'',pat:pat('empty')}]});
    groups.push({name:'TEMPORARY / FAMILY',rooms});}
  // CAPITAL1 — 남자(MALE)
  {const rooms=[];
    rooms.push({no:'301-1',gender:'m',per:'1인실',beds:[{name:fakeName()+' _single use',pat:pat('full')}]});
    rooms.push({no:'301-2',gender:'m',per:'1인실',beds:[{name:'staff_'+fakeName(),pat:pat('full')}]});
    for(let r=302;r<=311;r++){const beds=[];
      for(let b=0;b<3;b++){const tail=((r+b)%4===0)?' ('+fakeName().split(' ')[0]+' Univ.)':((r+b)%5===0)?' - holding student':'';
        beds.push({name:nm(2+((r+b)%3))+tail,pat:pat(nextKind())});}
      rooms.push({no:String(r),gender:'m',per:'3인실',beds});}
    groups.push({name:'CAPITAL1 / MALE',rooms});}
  // CAPITAL2 — 여자(FEMALE)
  {const rooms=[];for(let r=401;r<=406;r++){const per=(r%3===0)?'2인실':'3인실';const bn=per==='2인실'?2:3;const beds=[];
      for(let b=0;b<bn;b++)beds.push({name:nm(1+((r+b)%2)+1),pat:pat(nextKind())});
      rooms.push({no:String(r),gender:'f',per,beds});}
    groups.push({name:'CAPITAL2 / FEMALE',rooms});}
  // S hotel(H) — 공용
  {const rooms=[];for(let r=1;r<=4;r++){rooms.push({no:'H30'+r,gender:'fam',per:'2인실',beds:[{name:nm(2),pat:pat(nextKind())}]});}
    groups.push({name:'S hotel(H) / FAMILY',rooms});}

  const CLS={x:'cx',in:'cin',out:'cout',hold:'chold',e:'cempty'};
  const dcells=(p)=>p.map((st,i)=>`<td class="dcell ${CLS[st]}" data-date="${dateLabels[i]}">${st==='e'?'':'X'}</td>`).join('');
  const colg=`<colgroup><col style="width:72px"><col style="width:58px"><col style="width:230px">${Array(TOTAL).fill(`<col style="width:${CELLW}px">`).join('')}</colgroup>`;
  const monRow=months.map(mo=>`<th class="mon${mo.off===0?' mon-cur':''}" colspan="${mo.days}">${mo.y} 년 ${pad(mo.m)} 월</th>`).join('');
  const dayRow=months.map(mo=>Array.from({length:mo.days},(_,i)=>`<th class="dh">${i+1}</th>`).join('')).join('');
  const head=`<thead><tr><th class="c1" rowspan="2">방번호</th><th class="c2" rowspan="2">인실</th><th class="c3" rowspan="2">이름</th>${monRow}</tr><tr>${dayRow}</tr></thead>`;

  let body='';
  groups.forEach(g=>{
    body+=`<tbody class="grp-head"><tr><td colspan="${3+TOTAL}"><span class="grp-label">${g.name}</span></td></tr></tbody>`;
    g.rooms.forEach(r=>{
      const h=r.beds.length*27;
      body+=`<tbody class="room-block" style="contain-intrinsic-size:auto ${h}px">`;
      r.beds.forEach((bed,bi)=>{
        body+=`<tr><td class="info rno c1">${bi===0?r.no:''}</td>`
            +`<td class="info c2"><span class="per ${r.gender}">${r.per}</span></td>`
            +`<td class="info name c3">${bed.name||''}</td>`
            +dcells(bed.pat)+`</tr>`;
      });
      body+=`</tbody>`;
    });
  });

  const sel=months.map(mo=>`<button class="btn${mo.off===0?' on':''}" data-my="${mo.y}" data-mm="${mo.m}" title="${mo.y}년 ${pad(mo.m)}월">${String(mo.y).slice(2)}.${pad(mo.m)}</button>`).join('');

  return `
  <div class="ph"><h1>기숙사 현황 (배치도)</h1><span class="sub">room_stat3.php · 방배치 캘린더</span>
    <span class="actions dorm-actions" style="margin-left:auto">
      <button class="btn">📊 1MONTH EXCEL(TOTAL)</button>
      <button class="btn">📊 2MONTH EXCEL(TOTAL)</button>
      <button class="btn">⚠ ROOM ERROR CHECK</button>
    </span></div>
  <div class="dorm-bar">
    <div class="legend" style="margin:0">
      <span><i style="background:var(--male)"></i> 남자 (MALE)</span>
      <span><i style="background:var(--female)"></i> 여자 (FEMALE)</span>
      <span><i style="background:#ca8a04"></i> 공용 (FAMILY)</span>
    </div>
    <div class="month-jump" title="선택월이 중앙으로 정렬됩니다 (±6개월)">${sel}</div>
  </div>
  <div class="state-legend" style="margin-bottom:12px">
    <span><i style="background:var(--good)">X</i> 입실 (CHECK-IN)</span>
    <span><i style="background:var(--female)">X</i> 퇴실 (CHECK-OUT)</span>
    <span><i style="background:var(--return)">X</i> 홀딩/방변경 (HOLD/MOVE)</span>
    <span><i style="background:var(--surface-2);color:var(--faint);border:1px solid var(--border)">X</i> 재실 (STAY)</span>
    <span><i style="background:var(--surface);border:1px solid var(--border)"></i> 빈방 (VACANT)</span>
  </div>
  <div class="twrap dorm-scroll" data-mstart="${centerStart}" data-mwidth="${centerWidth}" data-infow="${INFOW}"><table class="gantt" style="width:${INFOW+TOTAL*CELLW}px">${colg}${head}${body}</table></div>
  <div class="note" style="margin-top:12px">레거시 <span class="mono">room_stat3.php</span> 방×일자 배치 캘린더 — <b>선택월 ±6개월(13개월)</b> 표시, 월 클릭 시 <b>그 달이 중앙으로</b> 정렬되며 좌우 스크롤 · <b>틀 고정</b> · <b>셀 클릭→입/퇴실·방배정·방변경</b> · content-visibility. 표시 데이터는 가상 샘플(실제 개인정보 아님).</div>`;};

let curCat='record', curKey='dash', curMenu=null;
function closeDropdowns(){document.querySelectorAll('.dropdown.open').forEach(d=>d.classList.remove('open'));}
function renderCats(){const c=document.getElementById('cats');c.innerHTML='';
  CATS.forEach(ct=>{
    const wrap=el('div','catwrap');

      a.onclick=(e)=>{e.stopPropagation();curCat=ct.id;curKey=m.k;curMenu=m;closeDropdowns();renderAll();};
      dd.appendChild(a);});

function renderAll(){if(!curMenu)curMenu=MENU[curCat][0];renderCats();renderMain();}

const running={};
function guard(btn){const kind=btn.dataset.guard;
  if(running[kind]){toast('이미 실행 중입니다',`${kind==='invoice'?'인보이스 발행':'저장'}이 진행 중입니다. 중복 요청이 차단되었습니다 (멱등키 재사용 → 중복 레코드 미생성).`,false);return;}
  running[kind]=true;const orig=btn.innerHTML;btn.disabled=true;btn.innerHTML=`<span class="spin"></span> 처리 중…`;
  setTimeout(()=>{running[kind]=false;btn.disabled=false;btn.innerHTML=orig;
    toast(kind==='invoice'?'인보이스 발행 완료':'저장 완료',`멱등키 확정 · 중복 없이 1건 처리되었습니다.`,true);},1800);}

  const pop=el('div','cellpop');pop.id='cellpop';
  pop.appendChild(el('div','cp-h',`<b>${room||'-'}</b> · ${date}<br>${name}`));
  CELL_ACTIONS.forEach(([label,cls,color])=>{
    const b=el('button',null,`<i style="background:${color}"></i>${label}`);
    b.onclick=(e)=>{e.stopPropagation();
      cell.className='dcell '+cls;cell.textContent=(cls==='cempty')?'':'X';
      closeCellPop();
      toast(label.split(' ')[0]+' 처리 완료',`${room||'-'} · ${name} · ${date} (멱등 처리 · 중복 반영 없음)`,true);};
    pop.appendChild(b);
  });
  document.body.appendChild(pop);
  const r=cell.getBoundingClientRect();const pw=pop.offsetWidth,ph=pop.offsetHeight;
  let left=r.left+window.scrollX, top=r.bottom+window.scrollY+4;
  if(left+pw>window.scrollX+innerWidth-8)left=window.scrollX+innerWidth-pw-8;
  if(top+ph>window.scrollY+innerHeight-8)top=r.top+window.scrollY-ph-4;
  pop.style.left=left+'px';pop.style.top=top+'px';
}
document.addEventListener('click',(e)=>{
  if(!e.target.closest('.catwrap'))closeDropdowns();
  const cell=e.target.closest('.gantt td.dcell');
  if(cell){e.stopPropagation();openCellPop(cell,e);return;}
  if(!e.target.closest('#cellpop'))closeCellPop();
});
document.addEventListener('keydown',(e)=>{if(e.key==='Escape'){closeCellPop();closeDropdowns();}});

applyHash();renderAll();
window.addEventListener('hashchange',()=>{applyHash();renderAll();});
</script>
