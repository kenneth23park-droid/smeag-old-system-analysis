<title>SMEAG 관리자 — 신규 화면 프로토타입</title>
<style>
  :root{
    --bg:#eef1f2; --surface:#ffffff; --surface-2:#f4f6f7; --border:#dbe2e4;
    --text:#17242b; --dim:#5c6d74; --faint:#85959c;
    --accent:#0f766e; --accent-weak:#d6ede9; --accent-ink:#0b5751;
    --male:#2563eb; --female:#e11d48; --family:#d97706; --empty:#aab6bc;
    --good:#15803d; --warn:#b45309; --neutral:#64748b; --return:#7c3aed; --install:#0891b2;
    --shadow:0 1px 2px rgba(20,40,50,.06),0 2px 8px rgba(20,40,50,.05);
    --c-enc:#0f766e; --c-cla:#4f46e5; --c-cap:#0e7490;
    --r:10px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0d1417; --surface:#141e22; --surface-2:#1a262b; --border:#2a393f;
      --text:#e7edef; --dim:#93a4ab; --faint:#6c7d84;
      --accent:#2dd4bf; --accent-weak:#123b38; --accent-ink:#9defe4;
      --male:#60a5fa; --female:#fb7185; --family:#fbbf24; --empty:#3a4a51;
      --good:#4ade80; --warn:#fbbf24; --neutral:#94a3b8; --return:#a78bfa; --install:#38bdf8;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
      --c-enc:#2dd4bf; --c-cla:#818cf8; --c-cap:#22d3ee;
    }
  }
  :root[data-theme="light"]{
    --bg:#eef1f2; --surface:#ffffff; --surface-2:#f4f6f7; --border:#dbe2e4;
    --text:#17242b; --dim:#5c6d74; --accent:#0f766e; --accent-weak:#d6ede9; --accent-ink:#0b5751;
    --male:#2563eb; --female:#e11d48; --family:#d97706; --empty:#aab6bc;
    --good:#15803d; --warn:#b45309; --neutral:#64748b; --return:#7c3aed; --install:#0891b2;
    --c-enc:#0f766e; --c-cla:#4f46e5; --c-cap:#0e7490;
  }
  :root[data-theme="dark"]{
    --bg:#0d1417; --surface:#141e22; --surface-2:#1a262b; --border:#2a393f;
    --text:#e7edef; --dim:#93a4ab; --accent:#2dd4bf; --accent-weak:#123b38; --accent-ink:#9defe4;
    --male:#60a5fa; --female:#fb7185; --family:#fbbf24; --empty:#3a4a51;
    --good:#4ade80; --warn:#fbbf24; --neutral:#94a3b8; --return:#a78bfa; --install:#38bdf8;
    --c-enc:#2dd4bf; --c-cla:#818cf8; --c-cap:#22d3ee;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
  .app{display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;
    grid-template-areas:"top" "main";min-height:100vh}

  /* TOPBAR */
  .top{grid-area:top;display:flex;align-items:center;gap:18px;padding:0 18px;height:56px;
    background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
  .brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--c-cap));
    display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900}
  .brand small{font-weight:600;color:var(--dim);font-size:11px;letter-spacing:.4px}
  .cats{display:flex;gap:4px;margin-left:6px}
  .cat{border:0;background:transparent;color:var(--dim);font:inherit;font-weight:650;cursor:pointer;
    padding:8px 14px;border-radius:8px;display:flex;align-items:center;gap:7px}
  .cat:hover{background:var(--surface-2);color:var(--text)}
  .cat.active{background:var(--accent-weak);color:var(--accent-ink)}
  .cat .ic{font-size:15px}
  .top .spacer{flex:1}
  .campus-sel{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:8px;padding:5px 10px}
  .campus-sel label{font-size:11px;color:var(--dim);font-weight:600}
  .campus-sel select{border:0;background:transparent;color:var(--text);font:inherit;font-weight:650;cursor:pointer}
  .who{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px}
  .who .av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
  .theme-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--dim);border-radius:8px;
    width:32px;height:32px;cursor:pointer;font-size:14px}

  /* 탑다운 드롭다운 네비 (상단 카테고리 아래로 펼침) */
  .catwrap{position:relative}
  .cat .caret{font-size:10px;opacity:.6;margin-left:2px}
  .dropdown{position:absolute;top:calc(100% + 8px);left:0;background:var(--surface);
    border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);padding:7px;
    min-width:250px;max-height:74vh;overflow-y:auto;z-index:40;display:none}
  .dropdown.open{display:block}
  .dd-title{font-size:10.5px;font-weight:750;letter-spacing:.5px;color:var(--faint);
    text-transform:uppercase;padding:5px 10px 7px}
  .dropdown a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;
    color:var(--dim);text-decoration:none;font-size:13px;cursor:pointer;margin-bottom:1px}
  .dropdown a:hover{background:var(--surface-2);color:var(--text)}
  .dropdown a.active{background:var(--accent-weak);color:var(--accent-ink);font-weight:700}
  .dropdown a .dot{width:5px;height:5px;border-radius:50%;background:var(--empty);flex:none}
  .dropdown a.active .dot{background:var(--accent)}
  .dropdown a .tag{margin-left:auto;font-size:10px;color:var(--faint);font-weight:600}

  /* MAIN */
  .main{grid-area:main;padding:18px 24px 40px;overflow-x:hidden}
  .ph{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .ph h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.2px}
  .ph .sub{color:var(--dim);font-size:12.5px}
  .ph .url{margin-left:auto;font-size:11.5px;color:var(--faint)}
  .ph .actions{display:flex;gap:8px}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-weight:650;
    padding:7px 13px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:var(--surface-2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .btn .spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
    animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.btn .spin{animation:none}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:16px}

  /* filter bar */
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px}
  .field{display:flex;flex-direction:column;gap:3px}
  .field label{font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.3px;padding-left:2px}
  .field select,.field input{border:1px solid var(--border);background:var(--surface-2);color:var(--text);
    font:inherit;font-size:12.5px;padding:6px 9px;border-radius:7px;min-width:110px}
  .filters .grow{flex:1}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .chip{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);
    color:var(--dim);font-weight:650}
  .chip.on{background:var(--accent-weak);border-color:transparent;color:var(--accent-ink)}
  .pager{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:13px;color:var(--dim);flex-wrap:wrap}
  .pager .pginfo b{color:var(--text)}
  .pager select,.pager input{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:7px;padding:5px 8px;font:inherit;font-size:12.5px}
  .pager input{width:70px;text-align:center}

  /* table */
  .twrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
  table.grid{border-collapse:collapse;width:100%;font-size:12.5px;min-width:640px}
  table.grid th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:9px 11px;
    font-size:10.5px;letter-spacing:.4px;color:var(--dim);text-transform:uppercase;font-weight:750;
    border-bottom:1px solid var(--border);white-space:nowrap}
  table.grid td{padding:9px 11px;border-bottom:1px solid var(--border);white-space:nowrap}
  table.grid tr:last-child td{border-bottom:0}
  table.grid tbody tr:hover{background:var(--surface-2)}
  td.num,th.num{text-align:right}
  table.grid th.sortable{cursor:pointer;user-select:none}
  table.grid th.sortable:hover{color:var(--text);background:var(--accent-weak)}
  table.grid th .sarr{color:var(--accent);font-weight:800}
  table.grid tr.grp td{background:var(--surface-2);font-weight:800;font-size:11.5px;letter-spacing:.3px;color:var(--dim)}
  table.grid tr.in td{background:color-mix(in srgb,var(--female) 9%,transparent)}
  /* ── FREEZE: 상단 전체(제목·필터·칩·테이블헤더) 고정, 표의 행만 스크롤 ── */
  .main.freeze{box-sizing:border-box;height:calc(100dvh - 56px);overflow:hidden;
    display:flex;flex-direction:column;padding-bottom:14px}
  .main.freeze > .ph, .main.freeze > .filters, .main.freeze > .chips, .main.freeze > .banner{flex:none}
  .main.freeze > #specBody, .main.freeze > #stdBody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .main.freeze #specBody .twrap, .main.freeze #stdBody .twrap{flex:1 1 auto;min-height:0;max-height:none;overflow:auto}
  .main.freeze #specBody .pager, .main.freeze #stdBody .pager{flex:none;margin-top:10px}
  /* (비-freeze 폴백) 데이터그리드 헤더·좌측컬럼 고정 */
  #specBody .twrap, #stdBody .twrap{max-height:calc(100vh - 232px);overflow:auto}
  #specBody table.grid th, #stdBody table.grid th{top:0;z-index:3}
  #specBody table.grid th:first-child, #stdBody table.grid th:first-child{left:0;z-index:5}
  #specBody table.grid td:first-child, #stdBody table.grid td:first-child{position:sticky;left:0;z-index:2;background:var(--surface)}
  #specBody table.grid tbody tr:hover td:first-child, #stdBody table.grid tbody tr:hover td:first-child{background:var(--surface-2)}
  /* STUDENT LIST 행 액션(수정/변경/연장/상담/약식) — 레거시 재현 */
  td.std-act{white-space:nowrap}
  .btn.xs{padding:2px 7px;font-size:10.5px;font-weight:700;border-radius:6px;margin-right:2px;line-height:1.5}
  .btn.xs[data-sact="edit"]{color:var(--accent-ink);border-color:var(--accent)}
  .btn.xs[data-sact="move"]{color:var(--return);border-color:var(--return)}
  .btn.xs[data-sact="extend"]{color:var(--good);border-color:var(--good)}
  .btn.xs[data-sact="counsel"]{color:#0369a1;border-color:#0ea5e9}
  .btn.xs[data-sact="brief"]{color:var(--dim)}
  .pill.in{color:var(--female);background:color-mix(in srgb,var(--female) 15%,transparent)}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;
    background:var(--surface-2);color:var(--dim)}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.male{color:var(--male);background:color-mix(in srgb,var(--male) 14%,transparent)}
  .pill.female{color:var(--female);background:color-mix(in srgb,var(--female) 14%,transparent)}
  .pill.family{color:var(--family);background:color-mix(in srgb,var(--family) 14%,transparent)}
  .pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
  .pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
  .pill.install{color:var(--install);background:color-mix(in srgb,var(--install) 14%,transparent)}
  .pill.return{color:var(--return);background:color-mix(in srgb,var(--return) 14%,transparent)}
  .pill.neutral{color:var(--neutral);background:color-mix(in srgb,var(--neutral) 14%,transparent)}
  .cch{font-size:10.5px;font-weight:750;padding:2px 8px;border-radius:6px;letter-spacing:.3px}
  .cch.enc{color:#fff;background:var(--c-enc)} .cch.cla{color:#fff;background:var(--c-cla)} .cch.cap{color:#fff;background:var(--c-cap)}
  @media (prefers-color-scheme:dark){.cch{color:#08120f !important}}
  :root[data-theme="dark"] .cch{color:#08120f !important}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
  .kpi .k{font-size:11px;color:var(--dim);font-weight:650;letter-spacing:.2px}
  .kpi .v{font-size:26px;font-weight:820;letter-spacing:-.6px;margin-top:3px}
  .kpi .d{font-size:11px;margin-top:4px;color:var(--dim)}
  .kpi .d b{color:var(--good)}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
  .h3{font-size:13px;font-weight:750;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .h3 .mini{font-size:11px;color:var(--faint);font-weight:600}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12px}
  .bar-row .lb{width:78px;color:var(--dim)}
  .bar-track{flex:1;height:9px;background:var(--surface-2);border-radius:6px;overflow:hidden;display:block}
  .bar-fill{display:block;height:100%;border-radius:6px;min-width:2px}
  .bar-row .vv{width:52px;text-align:right;font-weight:700}
  .feed{display:flex;flex-direction:column;gap:2px}
  .feed .it{display:flex;gap:9px;padding:8px 4px;border-bottom:1px solid var(--border);font-size:12px;align-items:center}
  .feed .it:last-child{border-bottom:0}
  .feed .it .t{color:var(--faint);font-size:10.5px;width:44px;flex:none}
  .feed .it .m{color:var(--dim)}

  /* room grid */
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:12px;color:var(--dim)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .zone{margin-bottom:16px}
  .zone .zt{font-size:11px;font-weight:750;color:var(--dim);letter-spacing:.4px;margin:0 0 8px;text-transform:uppercase}
  .rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px}
  .room{border:1px solid var(--border);border-radius:9px;padding:9px;background:var(--surface);cursor:default;
    border-left:4px solid var(--empty);transition:transform .08s}
  .room:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .room.m{border-left-color:var(--male)} .room.f{border-left-color:var(--female)} .room.fam{border-left-color:var(--family)}
  .room .rn{font-weight:800;font-size:13px} .room .rc{font-size:10.5px;color:var(--dim);margin-top:2px}
  .room .rocc{font-size:10.5px;margin-top:5px;font-weight:700}
  .room.m .rocc{color:var(--male)} .room.f .rocc{color:var(--female)} .room.fam .rocc{color:var(--family)}
  .room.empty .rocc{color:var(--empty)}

  /* dorm occupancy gantt (room_stat3) — 대용량 대비 (틀고정 + 월점프 + content-visibility) */
  .dorm-actions{display:flex;gap:8px;flex-wrap:wrap}
  .dorm-actions .btn{font-size:11.5px;padding:6px 11px}
  .dorm-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
  .state-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
  .state-legend span{display:inline-flex;align-items:center;gap:6px}
  .state-legend i{width:15px;height:15px;border-radius:3px;display:inline-grid;place-items:center;font-size:9px;font-weight:800;color:#fff;flex:none}
  .month-jump{margin-left:auto;display:flex;gap:5px;overflow-x:auto;max-width:60%;padding-bottom:2px}
  .month-jump .btn{padding:5px 9px;font-size:11px;flex:none}
  .month-jump .btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .rs-ctrl{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;font-weight:650;cursor:pointer}
  input.rs-ctrl{cursor:text}
  .rs-search{display:inline-flex;align-items:center;gap:7px}
  .rs-cnt{font-size:11px;font-weight:700;color:var(--accent-ink);min-width:26px}
  .rs-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;min-height:320px;color:var(--dim);text-align:center;border:2px dashed var(--border);border-radius:14px;background:var(--surface);margin-top:4px}
  .rs-placeholder b{font-size:18px;color:var(--text)}
  .rs-ph-ico{font-size:42px;opacity:.85}
  .rs-ph-sub{font-size:12.5px;color:var(--dim);line-height:1.7;max-width:540px}
  /* ─ DB 쓰기 확인/에러 메세지박스 ─ */
  .cbx-ov{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:1000}
  .cbx{width:min(440px,92vw);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
  .cbx-h{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:800;font-size:15px}
  .cbx-h .op{margin-left:auto;font-size:11px;font-weight:750;color:var(--dim);text-transform:uppercase}
  .cbx-body{padding:16px}
  .cbx-ask{font-size:14px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--border)}
  .cbx-ask b{font-weight:800}
  .cbx-gauge{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .cbx-num{font-size:34px;font-weight:850;line-height:1;font-variant-numeric:tabular-nums}
  .cbx-bar{flex:1}
  .cbx-bar .track{height:9px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
  .cbx-bar .fill{height:100%;border-radius:6px;transition:width .3s}
  .cbx-lv{font-size:11px;font-weight:800;margin-top:5px;letter-spacing:.4px}
  .cbx-checks{display:flex;flex-direction:column;gap:6px}
  .cbx-chk{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;padding:7px 9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border)}
  .cbx-chk .ic{font-weight:900;flex:none;width:16px;text-align:center}
  .cbx-chk .lb{font-weight:750;flex:none;min-width:72px}
  .cbx-chk .dt{color:var(--dim)}
  .cbx-chk.pass .ic{color:var(--good)} .cbx-chk.warn .ic{color:#ca8a04} .cbx-chk.block .ic{color:var(--female)}
  .cbx-chk.block{border-color:color-mix(in srgb,var(--female) 45%,var(--border));background:color-mix(in srgb,var(--female) 8%,var(--surface-2))}
  .cbx-warnmsg{margin-top:12px;font-size:12px;font-weight:700;color:var(--female);display:flex;gap:7px;align-items:center}
  .cbx-foot{display:flex;gap:9px;justify-content:flex-end;padding:13px 16px;border-top:1px solid var(--border);background:var(--surface-2)}
  .cbx-foot .btn{padding:8px 16px;font-size:13px;font-weight:750}
  .cbx-foot .btn.go{background:var(--accent);border-color:var(--accent);color:#fff}
  .cbx-foot .btn.danger{background:var(--female);border-color:var(--female);color:#fff}
  .cbx.err .cbx-h{color:var(--female)}
  .cbx-errmeta{font-family:var(--mono,monospace);font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:10px;white-space:pre-wrap;word-break:break-word}
  .cbx-errid{margin-top:9px;font-size:11.5px;color:var(--dim)}

// 헤더 클릭 정렬 (숫자/문자 자동) — 모든 .grid 표
function makeSortable(scope){scope.querySelectorAll('table.grid').forEach(tbl=>{
  const ths=[...tbl.querySelectorAll('thead th')];
  ths.forEach((th,idx)=>{ if(th.dataset.wired)return; th.dataset.wired='1'; th.classList.add('sortable');
    th.addEventListener('click',()=>{
      const tb=tbl.querySelector('tbody'); if(!tb)return;
      const rows=[...tb.querySelectorAll('tr')].filter(r=>!r.classList.contains('grp'));
      if(!rows.length)return;
      const dir=th.dataset.dir==='asc'?'desc':'asc';
      ths.forEach(x=>{x.dataset.dir='';const s=x.querySelector('.sarr');if(s)s.remove();});
      th.dataset.dir=dir;
      const val=r=>((r.children[idx]||{}).textContent||'').trim();
      const num=rows.every(r=>{const t=val(r).replace(/[,%\s]/g,'');return t===''||t==='—'||!isNaN(t);});
      rows.sort((a,b)=>{let x=val(a),y=val(b);
        if(num){x=parseFloat(x.replace(/[,%\s]/g,''))||0;y=parseFloat(y.replace(/[,%\s]/g,''))||0;return dir==='asc'?x-y:y-x;}
        return dir==='asc'?x.localeCompare(y,'ko'):y.localeCompare(x,'ko');});
      tb.querySelectorAll('tr.grp').forEach(g=>g.remove()); // 정렬 시 그룹헤더 평탄화
      rows.forEach(r=>tb.appendChild(r));
      th.appendChild(el('span','sarr',dir==='asc'?' ▲':' ▼'));
    });});});}

  csvDownload([heads,...rows],fname); toast('엑셀 내보내기 완료',`${rows.length}행 · 현재 정렬 순서 그대로`,true);}
// Excel XML(SpreadsheetML .xls): 헤더 노란배경+AutoFilter(정렬/필터), 지정 컬럼 빨강
function toXls(headers,rows,fname,redCols){redCols=redCols||[];
  const x=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const isNum=v=>{const s=String(v).replace(/[,%\s]/g,'');return s!==''&&/^-?\d+(\.\d+)?$/.test(s);};
  const hdr='<Row>'+headers.map(h=>`<Cell ss:StyleID="hdr"><Data ss:Type="String">${x(h)}</Data></Cell>`).join('')+'</Row>';
  const body=rows.map(r=>'<Row>'+r.map((c,i)=>{const st=redCols.includes(i)?' ss:StyleID="red"':'';
    const num=isNum(c);return `<Cell${st}><Data ss:Type="${num?'Number':'String'}">${num?String(c).replace(/[,%\s]/g,''):x(c)}</Data></Cell>`;}).join('')+'</Row>').join('');
  const N=rows.length+1,M=headers.length;
  const xml=`<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:x="urn:schemas-microsoft-com:office:excel">\n<Styles>\n<Style ss:ID="hdr"><Interior ss:Color="#FFE14D" ss:Pattern="Solid"/><Font ss:Bold="1" ss:Color="#3A2F00"/><Alignment ss:Horizontal="Center"/></Style>\n<Style ss:ID="red"><Font ss:Color="#E11D48" ss:Bold="1"/></Style>\n</Styles>\n<Worksheet ss:Name="SMEAG"><Table>\n${hdr}\n${body}\n</Table>\n<AutoFilter x:Range="R1C1:R${N}C${M}" xmlns="urn:schemas-microsoft-com:office:excel"/>\n</Worksheet>\n</Workbook>`;
  const blob=new Blob([xml],{type:'application/vnd.ms-excel'}),url=URL.createObjectURL(blob),a=el('a');
  a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);}
// 현재 .grid → xls (정렬순서 그대로, 노란 헤더+필터, TIME/시간 컬럼 빨강)
function exportGridXls(fname){const tbl=document.querySelector('#main table.grid');if(!tbl){toast('내보낼 표 없음','',false);return;}

  const redCols=heads.map((h,i)=>/^time$|시간/i.test(h)?i:-1).filter(i=>i>=0);
  const rows=[...tbl.querySelectorAll('tbody tr')].filter(r=>!r.classList.contains('grp')).map(tr=>[...tr.children].map(td=>td.querySelector('button')?'':td.textContent.trim()));
  toXls(heads,rows,fname,redCols); toast('엑셀 내보내기 완료',`${rows.length}행 · 노란 헤더·필터/정렬·시간 빨강 (현재 정렬 순서)`,true);}

R.roomstat=()=>{
  const CELLW=22, INFOW=86+58+230; // 방번호+인실+이름 = 좌측 고정폭
  const pad=n=>String(n).padStart(2,'0');
  const daysIn=(y,m)=>new Date(y,m,0).getDate();
  // 선택월(roomCenter) 기준 ±6개월 = 13개월
  const months=[];
  for(let off=-6;off<=6;off++){let y=roomCenter.y,m=roomCenter.m+off;
    while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}months.push({y,m,days:daysIn(y,m),off});}
  const TOTAL=months.reduce((s,x)=>s+x.days,0);
  let daysBefore=0;for(let i=0;i<6;i++)daysBefore+=months[i].days; // 중심월 시작 오프셋(일)
  const centerStart=daysBefore*CELLW, centerWidth=months[6].days*CELLW;
  // 전체 날짜 라벨(셀 클릭 액션용)
  const dateLabels=[];months.forEach(mo=>{for(let d=1;d<=mo.days;d++)dateLabels.push(`${mo.y}-${pad(mo.m)}-${pad(d)}`);});

  const nm=(n)=>Array.from({length:n},fakeName).join(' - ');
  const c=daysBefore;
  function pat(kind){const a=Array(TOTAL).fill('x');const s=seed++;
    if(kind==='empty')return Array(TOTAL).fill('e');
    if(kind==='full'){if(s%3===0){a[c+3]='hold';a[c+4]='in';}if(s%5===0){a[c+24]='hold';a[c+25]='out';}return a;}
    if(kind==='latein'){const d=c+(2+s%6);for(let i=0;i<d;i++)a[i]='e';if(a[d]!==undefined)a[d]='in';return a;}
    if(kind==='earlyout'){const d=c+(12+s%10);for(let i=d+1;i<TOTAL;i++)a[i]='e';if(a[d]!==undefined)a[d]='out';return a;}
    if(kind==='gap'){const d1=c+(8+s%6),d2=d1+3;a[d1]='out';for(let i=d1+1;i<d2;i++)a[i]='e';if(a[d2]!==undefined)a[d2]='in';return a;}
    return a;}
  const KINDS=['full','full','latein','full','earlyout','full','gap','full','full','latein'];let ki=0;
  const nextKind=()=>KINDS[ki++%KINDS.length];

  // 실데이터 예약 세그먼트 → 날짜별 상태(입실/재실/퇴실/빈방)
  // 레거시 room_stat3 색: rr_type S(입실)=red, E(퇴실)=purple, R(예약)=green, I(재실)=흰X
  const RRK={S:'in',E:'out',R:'rsv'};
  const realPat=(segs)=>dateLabels.map(d=>{for(const sg of (segs||[])){
    if(d<sg.s||d>sg.e)continue;
    if(sg.s===sg.e)return RRK[sg.st]||'x';
    if(d===sg.s)return RRK[sg.st]||'x';
    if(d===sg.e)return RRK[sg.et]||'x';
    return 'x';
  }return 'e';});
  // 이름칸(레거시 room_stat3 규칙): 선택월(중앙월)의 "현재 점유자"부터 앞으로 전개.
  //   - 첫 점유자(현재 방 사용자)는 staff/홀딩이어도 표시(준블락_single use 등).
  //   - 이후 세그먼트는 예약(R)·홀딩(h)에서 중단(실학생 뒤 임시홀딩 Tammy 등 제외).
  //   - 선택월 이전 종료분 제외, 가시범위 밖 미래 제외. 월 클릭 시 갱신.
  const cFrom=`${roomCenter.y}-${pad(roomCenter.m)}-01`;
  const cHorizon=dateLabels[dateLabels.length-1];
  const bedName=(segs)=>{
    const ss=(segs||[]).filter(s=>s.nm).slice().sort((a,b)=>a.s.localeCompare(b.s));
    const seen=new Set(),ns=[];let started=false;
    for(const sg of ss){
      if(sg.e<cFrom)continue;      // 선택월 이전 종료 → 제외
      if(sg.s>cHorizon)break;      // 가시범위 밖 미래 → 중단
      if(started&&(sg.st==='R'||sg.h))break;  // 첫 점유자 이후의 예약/홀딩에서 중단
      if(!seen.has(sg.nm)){seen.add(sg.nm);ns.push(sg.nm);}
      started=true;
      if(ns.length>=6)break;
    }
    return ns.join(' / ');};
  let groups;
  if(REAL&&REAL.roomstat&&REAL.roomstat.groups){
    groups=REAL.roomstat.groups.map(g=>({name:g.name,rooms:g.rooms.map(r=>({no:r.no,per:r.per,gender:r.gender,
      beds:(r.beds&&r.beds.length?r.beds:[{name:'',segs:[]}]).map(b=>({name:(b.segs&&b.segs.length?bedName(b.segs):(b.name||'')),pat:realPat(b.segs)}))}))}));
  }else{
  groups=[];
  // TEMPORARY — 공용(FAMILY), 1인실, 전실 공실
  {const rooms=[];for(let i=0;i<16;i++)rooms.push({no:(100+i)+'-temp',gender:'fam',per:'1인실',beds:[{name:'',pat:pat('empty')}]});
    groups.push({name:'TEMPORARY / FAMILY',rooms});}
  // CAPITAL1 — 남자(MALE)
  {const rooms=[];

    for(let r=302;r<=311;r++){const beds=[];

        beds.push({name:nm(2+((r+b)%3))+tail,pat:pat(nextKind())});}
      rooms.push({no:String(r),gender:'m',per:'3인실',beds});}
    groups.push({name:'CAPITAL1 / MALE',rooms});}
  // CAPITAL2 — 여자(FEMALE)
  {const rooms=[];for(let r=401;r<=406;r++){const per=(r%3===0)?'2인실':'3인실';const bn=per==='2인실'?2:3;const beds=[];
      for(let b=0;b<bn;b++)beds.push({name:nm(1+((r+b)%2)+1),pat:pat(nextKind())});

  // S hotel(H) — 공용

  }

  // 레거시 필터: 센터(campus)·성별·방구분(인실)
  const campusOf=n=>{const u=(n||'').toUpperCase();return u.startsWith('CAPITAL')?'CAPITAL':u.startsWith('ENCANTO')?'ENCANTO':u.startsWith('CLASSIC')?'CLASSIC':'ETC';};

  const rsReady=roomFilter.center&&roomFilter.gender&&roomFilter.per; // 센터+성별+방구분 모두 선택돼야 표시
  if(rsReady){
    groups=groups.filter(g=>campusOf(g.name)===roomFilter.center);

  }else groups=[]; // 초기/미선택 → 렌더 안 함(선택 안내)
  if(roomFilter.sortPer){const pn=p=>parseInt(p)||0;groups=groups.map(g=>({name:g.name,rooms:[...g.rooms].sort((a,b)=>roomFilter.sortPer==='asc'?pn(a.per)-pn(b.per):pn(b.per)-pn(a.per))}));}
  const CLS={x:'cx',in:'cin',out:'cout',rsv:'crsv',hold:'chold',e:'cempty'};
  const dcells=(p)=>p.map((st,i)=>`<td class="dcell ${CLS[st]}" data-date="${dateLabels[i]}">${st==='e'?'':'X'}</td>`).join('');
  const colg=`<colgroup><col style="width:86px"><col style="width:58px"><col style="width:230px">${Array(TOTAL).fill(`<col style="width:${CELLW}px">`).join('')}</colgroup>`;
  const monRow=months.map(mo=>`<th class="mon${mo.off===0?' mon-cur':''}" colspan="${mo.days}">${mo.y} 년 ${pad(mo.m)} 월</th>`).join('');

  const head=`<thead><tr><th class="c1" rowspan="2">방번호</th><th class="c2" rowspan="2">인실</th><th class="c3" rowspan="2">이름</th>${monRow}</tr><tr>${dayRow}</tr></thead>`;

  let body='';
  groups.forEach(g=>{
    const bldg=(g.name||'').split('/')[0].trim(); // 그룹명 '건물/성별' 중 건물 부분(예 CAPITAL3)
    body+=`<tbody class="grp-head"><tr><td colspan="${3+TOTAL}"><span class="grp-label">${g.name}</span></td></tr></tbody>`;

      const h=r.beds.length*27;

      r.beds.forEach((bed,bi)=>{

            +`<td class="info name c3">${bed.name||''}</td>`

      });
      body+=`</tbody>`;
    });
  });

  const sel=months.map(mo=>`<button class="btn${mo.off===0?' on':''}" data-my="${mo.y}" data-mm="${mo.m}" title="${mo.y}년 ${pad(mo.m)}월">${String(mo.y).slice(2)}.${pad(mo.m)}</button>`).join('');
  roomstatCtx={months,dateLabels,groups,daysBefore}; // 엑셀 export 컨텍스트

  return `

    <span class="actions dorm-actions" style="margin-left:auto">
      <button class="btn" data-excel="1">📊 1MONTH EXCEL(TOTAL)</button>
      <button class="btn" data-excel="2">📊 2MONTH EXCEL(TOTAL)</button>

// ═══ DB 쓰기 안전 계약 클라이언트 (Supabase RPC ↔ 로컬 시뮬) ═══
//  · DBCFG.url+anonKey 설정 & supabase-js 로드 시 → 실 app.reserve_* RPC 호출
//  · 미설정 시 → 임베드 실데이터로 동일 4종 프리플라이트 로컬 시뮬(응답 계약 동일)
//  · 서버 계층: migration/schema/write_layer.sql
const DBCFG={url:'',anonKey:''}; // 이관 완료 후 채우면 실 RPC 전환
const OPMAP={'입실':'insert','방배정':'insert','퇴실':'update','홀딩':'update','빈방':'delete'};
const _inflight=new Set(); // 더블서밋 가드(논리 타깃 기준)
const newKey=(op,room,date,bed)=>`${op}:${room||'-'}:${date||'-'}:${bed||0}:${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`;

// 로컬 4종 신뢰도 — 서버 app.reservation_preflight 와 동일 의미/가중치(30·30·25·15)
function simPreflight(op,c){
  const checks=[]; let conf=100, blocked=false;
  const add=(k,l,s,d)=>{checks.push({key:k,label:l,severity:s,detail:d}); if(s==='block')blocked=true;};
  if(op==='insert'||op==='move'){
    if(c.isDup){add('dup','중복/멱등','block','동일 (방·학생·기간) 예약 존재 — 이중 저장');conf-=30;}
    else add('dup','중복/멱등','pass','중복 예약 없음');
  } else add('dup','중복/멱등','pass','해당없음');
  if(op==='insert'||op==='move'){
    if((c.occupied+1)>c.cap){add('capacity','정원/충돌','block',`정원 초과: 사용 ${c.occupied} + 1 > 정원 ${c.cap}`);conf-=30;}
    else if(c.selfOverlap){add('capacity','정원/충돌','warn','동일 학생 기간겹침(재실 충돌 가능)');conf-=15;}
    else add('capacity','정원/충돌','pass',`정원 ${c.cap} / 사용 ${c.occupied} — 여유`);
  } else add('capacity','정원/충돌','pass','해당없음');
  if(op==='delete'){
    if(!c.exists){add('fk','참조 무결성','block','삭제 대상 예약 없음');conf-=25;}
    else add('fk','참조 무결성','pass','삭제 대상 존재 확인');
  } else if(!c.hasRoom){add('fk','참조 무결성','block','방 참조 없음');conf-=25;}
  else if(!c.hasStudent){add('fk','참조 무결성','warn','학생 미지정(빈 침대) — 배정 필요');conf-=12;}
  else add('fk','참조 무결성','pass','방·학생 참조 유효');
  if(op==='delete')add('date','날짜 규칙','pass','해당없음');
  else if(!c.date){add('date','날짜 규칙','block','날짜 누락');conf-=15;}
  else add('date','날짜 규칙','pass','날짜 정상');
  if(conf<0)conf=0;
  return {confidence:conf,blocked,level:blocked?'block':(conf<90?'warn':'ok'),checks};
}

async function dbCall(op,params){
  // 실 RPC 경로
  if(DBCFG.url&&window.supabase){
    const sb=window._sb||(window._sb=window.supabase.createClient(DBCFG.url,DBCFG.anonKey));
    const fn={insert:'reserve_insert',update:'reserve_update',delete:'reserve_delete',move:'reserve_move'}[op];
    const {data,error}=await sb.rpc(fn,params.rpc);
    if(error)return {ok:false,error:true,op,sqlstate:error.code||'',message:error.message,error_id:'—'};
    return data;
  }
  // 로컬 시뮬(응답 계약 동일)
  const pf=simPreflight(op,params._ctx||{});
  if(pf.blocked&&!params.p_confirm)
    return {ok:false,need_confirm:true,op,confidence:pf.confidence,level:pf.level,checks:pf.checks};
  return {ok:true,op,id:params._ctx.id,confidence:pf.confidence,level:pf.level,checks:pf.checks,audit_id:Math.floor(Math.random()*1e6),_sim:true};
}
// 프리플라이트(쓰기 없이 신뢰도만) — 실 RPC app.reservation_preflight 또는 로컬 시뮬
async function dbPreflight(op,ctx){
  if(DBCFG.url&&window.supabase){
    const sb=window._sb||(window._sb=window.supabase.createClient(DBCFG.url,DBCFG.anonKey));
    const rpc=ctx.rpc||{};
    const {data,error}=await sb.rpc('reservation_preflight',{p_op:op,p_room_id:rpc.p_room_id??rpc.p_new_room_id??null,
      p_student_id:rpc.p_student_id??null,p_check_in:ctx.date||null,p_check_out:ctx.date||null,p_ri_type:'L',p_exclude_id:rpc.p_id??null});
    if(error||!data)return {confidence:0,level:'block',blocked:true,checks:[{key:'rpc',label:'프리플라이트',severity:'block',detail:(error&&error.message)||'응답 없음'}]};
    return {confidence:data.confidence,level:data.level,blocked:!!data.blocked,checks:data.checks||[]};
  }
  return simPreflight(op,ctx);
}

const LV_COLOR={ok:'var(--good)',warn:'#ca8a04',block:'var(--female)'};
const CHK_IC={pass:'✓',warn:'⚠',block:'⛔'};
// 확인 메세지박스 → Promise<boolean>(확정:true / 취소:false)
function showConfirmBox(resp,opLabel,danger,verb){
  return new Promise(res=>{
    const ov=el('div','cbx-ov');ov.id='cbx';
    const c=resp.confidence, lv=resp.level;
    const rows=(resp.checks||[]).map(k=>`<div class="cbx-chk ${k.severity}"><span class="ic">${CHK_IC[k.severity]||'•'}</span><span class="lb">${k.label}</span><span class="dt">${k.detail}</span></div>`).join('');
    const actLabel=verb||(danger?'삭제':'저장');
    ov.innerHTML=`<div class="cbx">
      <div class="cbx-h">🛡 ${opLabel} 확인<span class="op">${resp.op}</span></div>
      <div class="cbx-body">
        <div class="cbx-ask">${opLabel} — <b>${actLabel}하시겠습니까?</b></div>
        <div class="cbx-gauge">
          <div class="cbx-num" style="color:${LV_COLOR[lv]}">${c}<span style="font-size:15px">%</span></div>
          <div class="cbx-bar"><div class="track"><div class="fill" style="width:${c}%;background:${LV_COLOR[lv]}"></div></div>
            <div class="cbx-lv" style="color:${LV_COLOR[lv]}">DB 체크 신뢰도 · ${lv.toUpperCase()}</div></div>
        </div>
        <div class="cbx-checks">${rows}</div>
        ${lv==='block'?`<div class="cbx-warnmsg">⛔ 차단 항목이 있습니다. 그래도 ${actLabel}하면 강제 반영됩니다.</div>`:''}
      </div>
      <div class="cbx-foot">
        <button class="btn" id="cbxCancel">취소</button>
        <button class="btn ${lv==='block'||danger?'danger':'go'}" id="cbxGo">${actLabel}${lv==='block'?' (강제)':''}</button>
      </div></div>`;
    document.body.appendChild(ov);
    const done=v=>{ov.remove();res(v);};
    ov.querySelector('#cbxCancel').onclick=()=>done(false);
    ov.querySelector('#cbxGo').onclick=()=>done(true);
    ov.onclick=e=>{if(e.target===ov)done(false);};
    document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){done(false);document.removeEventListener('keydown',esc);}});
  });
}
function showErrorBox(resp){
  const ov=el('div','cbx-ov');ov.id='cbxErr';

// 오케스트레이터: 프리플라이트→확인박스(변경하시겠습니까?)→쓰기(블록이면 강제)→적용/에러
async function runWrite(op,opLabel,ctx,onOk,opts){
  opts=opts||{};
  const guard=`${op}:${ctx.room}:${ctx.date}:${ctx.bed}`;
  if(_inflight.has(guard))return; _inflight.add(guard);
  const key=newKey(op,ctx.room,ctx.date,ctx.bed);
  const mk=confirm=>({p_confirm:confirm,_ctx:ctx,rpc:Object.assign({p_key:key,p_confirm:confirm},ctx.rpc||{})});
  try{
    // 1) 프리플라이트(쓰기 전 신뢰도 계산)
    const pf=await dbPreflight(op,ctx);
    // 2) 확인 메세지박스 — 변경/삭제는 항상, 그 외엔 블록 시
    if(opts.alwaysConfirm||pf.blocked){
      const ok=await showConfirmBox({op,confidence:pf.confidence,level:pf.level,checks:pf.checks},opLabel,op==='delete',opts.verb);
      if(!ok)return; // 취소
    }
    // 3) 실제 쓰기 (블록이었으면 강제)
    let resp=await dbCall(op,mk(pf.blocked));
    if(resp&&resp.need_confirm){resp=await dbCall(op,mk(true));} // 실 RPC 안전망
    if(resp&&resp.error){showErrorBox(resp);return;}
    if(resp&&resp.ok){
      onOk&&onOk();
      // CRUD 로그(즉시): insert→create, update/move→update, delete→delete
      if(window.adminAuthLog){const KIND={insert:'create',update:'update',delete:'delete',move:'update'};
        try{window.adminAuthLog(opLabel,{room:ctx.room,date:ctx.date,confidence:resp.confidence},KIND[op]||'update');}catch(e){}}
      const tags=[`신뢰도 ${resp.confidence}%`];
      if(resp._sim)tags.push('시뮬');else tags.push('RPC');
      if(resp.replayed)tags.push('멱등재생');
      if(resp.level==='warn')tags.push('경고반영');
      if(resp.level==='block')tags.push('강제저장');
      tags.push(`멱등키 가드`);
      toast(`${opLabel} 처리 완료`,tags.join(' · '),true);
    }
  }catch(err){showErrorBox({op,sqlstate:'CLIENT',message:String(err&&err.message||err),error_id:'—'});}
  finally{_inflight.delete(guard);}
}
// 셀에서 4종 신뢰도 컨텍스트 추출(임베드 실데이터 기준)
function cellCtx(cell,room,name,date,op){
  const blk=cell.closest('tbody.room-block');
  const perTxt=blk?((blk.querySelector('.per')||{}).textContent||''):'';
  const cap=parseInt(perTxt)||4;
  const idx=[...cell.parentNode.children].indexOf(cell); // 절대 열 인덱스(정보3+일자)
  let occupied=0, bed=0;
  if(blk){const trs=[...blk.querySelectorAll('tr')];bed=trs.indexOf(cell.closest('tr'));
    trs.forEach(tr=>{const c=tr.children[idx];if(c&&(c.classList.contains('cin')||c.classList.contains('cx')||c.classList.contains('chold')))occupied++;});}
  const cur=cell.classList.contains('cin')||cell.classList.contains('cx');
  const hasStudent=!!(name&&name!=='(빈 침대)'&&name.trim());
  if(cur&&(op==='insert'))occupied=Math.max(0,occupied-1); // 자기 자신 제외
  return {room,date,bed,cap,occupied,isDup:op==='insert'&&cur,exists:cur,hasRoom:!!room,hasStudent,selfOverlap:false,id:Math.floor(Math.random()*1e6)};
}

function findStudent(nm){

  const first=(''+nm).split(' / ')[0].trim();
  const R=REAL.studentsFull.rows;
  return R.find(r=>(r[2]||'')===first||(r[3]||'')===first)
      || R.find(r=>((''+(r[2]||'')).includes(first))||((''+(r[3]||'')).includes(first)))||null;
}
function openRoomReplace(srcCell,room,name,date){

  const endD=(()=>{const d=new Date(date||'2026-07-08');d.setDate(d.getDate()+24);return d.toISOString().slice(0,10);})();
  // 실 학생 데이터 (studentsFull cols: 0AG 1NAT 2EN 3KOR 4AGE 5SEX 6등록 7출발 8시작 9종료 10기간 11상태 12코스 13객실 14CAMPUS 15항공)
  const stu=findStudent(name);
  const S=(i,d)=>{const v=stu&&stu[i];return v!=null&&v!==''?v:(d||'');};
  const begin=S(8,date), end=S(9,endD), per=S(10), dorm=S(13,room);
  const _cc=S(12); const course=[per?per+'주':null,_cc?'코스 '+_cc:null].filter(Boolean).join(' · ')||'-';
  // 실 후보 방목록 (roomstat 그룹 전체)
  let rows='';
  const grs=(REAL&&REAL.roomstat&&REAL.roomstat.groups)||[];
  grs.forEach(g=>{const parts=(g.name||'').split('/');const cat=parts[0].trim();const gm=GEN[(parts[1]||'').trim()]||['-','var(--dim)'];
    (g.rooms||[]).forEach(r=>{
      rows+=`<tr><td class="cat">${esc(cat)}</td><td class="mono">${esc(r.no)}</td><td class="mono">${esc(r.per||'')}</td>`
          +`<td style="color:${gm[1]};font-weight:750">${gm[0]}</td><td><button class="btn rp-move" data-to="${esc(cat)} ${esc(r.no)}" data-cap="${esc(r.per||'')}">MOVE</button></td></tr>`;});
  });
  if(!rows)rows=`<tr><td colspan="5" style="color:var(--dim);text-align:center;padding:14px">후보 방 데이터 없음</td></tr>`;
  const info=(k,v)=>`<tr><th>${k}</th><td>${v}</td></tr>`;
  const ta='<textarea rows=2 style="width:100%;border:1px solid var(--border);background:var(--surface-2);border-radius:6px"></textarea>';
  const ov=el('div','modal-ov');ov.id='roomModal';

          ${info('AGE',esc(S(4,'-')))}${info('SEX',(S(5)||'').toUpperCase()==='F'?'F':'M')}
          ${info('DEPARTURE',esc(S(7,date)))}${info('FLIGHT',`<span style="color:var(--female);font-weight:650">${esc(S(15,'-'))}</span>`)}
          ${info('COURSE',esc(course||'-'))}${info('DORM',esc(dorm||'-'))}
          ${info('NATIONALITY',(S(1)||'-').toUpperCase())}${info('CONDITION',esc(S(11,'normal')))}
          ${info('STAFF COMMENT',ta)}
          ${info('AGENTS COMMENT',ta)}
        </table>
        <div class="rp-t" style="margin-top:14px">※ DORMITORY RESERVED INFORMATION</div>
        <table class="rp-info"><tr><th>ROOM NUMBER</th><th>CAPACITY</th><th>PERIOD</th></tr>
          <tr><td class="mono">${esc(room||dorm||'-')}</td><td>${esc(per?per+'wk':'-')}</td><td class="mono">${esc(begin)} ~ ${esc(end)}</td></tr></table>
      </div>

  document.body.appendChild(ov);

  // 빠른작업(입실/퇴실/예약/방배정/홀딩/빈방) — 셀 기준 프리플라이트+확인
  ov.querySelectorAll('.rp-qa').forEach(b=>b.onclick=()=>{
    const w=b.dataset.w, cls=b.dataset.cls;
    const op=OPMAP[w]||'update';
    const verb=({'입실':'입실','퇴실':'퇴실','예약':'예약','방배정':'배정','홀딩':'홀딩','빈방':'취소'})[w]||'변경';
    const ctx=cellCtx(srcCell,room,name,date,op);
    runWrite(op,w,ctx,()=>{if(srcCell){srcCell.className='dcell '+cls;srcCell.textContent=(cls==='cempty')?'':'X';}ov.remove();},{alwaysConfirm:true,verb});});
  ov.querySelectorAll('.rp-move').forEach(b=>b.onclick=async()=>{
    // 대상 방 정원/사용 추정(후보행 CAPA 파싱), 이동은 신규 방 기준 프리플라이트
    const capTxt=b.closest('tr').querySelector('td:nth-child(3)')?.textContent||'';

      hasRoom:true,hasStudent:!!(name&&name.trim()),selfOverlap:false,

// 항공편 실시간 조회 — 서버리스 프록시(/api/flight, 키는 서버 env). 배포환경에서만 동작.
window.FLIGHT_API=(code,date)=>fetch(`/api/flight?code=${encodeURIComponent(code)}${date?`&date=${encodeURIComponent(date)}`:''}`)
  .then(r=>r.json()).then(d=>{if(!d||d.error&&!d.summary)throw new Error((d&&d.error)||'no');return d.summary||'정보 없음';});
// 여권번호 검사 — 국제 표준(영문+숫자 6~9자, 숫자 포함). 미입력/0 은 무효.
function validatePassport(v){
  v=(v||'').trim().toUpperCase();
  if(!v||v==='0')return {ok:false,msg:'미입력'};
  if(/\s/.test(v))return {ok:false,msg:'공백 불가'};
  if(!/^[A-Z0-9]{6,9}$/.test(v))return {ok:false,msg:'형식오류(영문·숫자 6~9자)'};
  if(!/[0-9]/.test(v))return {ok:false,msg:'숫자 포함 필요'};
  return {ok:true,msg:'유효'};
}

  const sel=(opts,cur)=>`<select class="smi-i">${opts.map(o=>`<option${o===cur?' selected':''}>${o}</option>`).join('')}</select>`;
  const mc=['ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN'].map((o,i)=>radio('smiMc',o,i===0)).join(' ');
  const ov=el('div','modal-ov');ov.id='smiModal';
  ov.innerHTML=`<div class="modal smi">
    <div class="modal-h"><b>STUDENT MANAGEMENT INFORMATION</b><span class="smi-badge">${actLbl}</span>
      <span class="smi-first">First Applier : ${g(0)}</span><button class="modal-x" id="smiClose">✕</button></div>
    <div class="smi-body"><table class="smi-t">
      ${sec('AGENCY INFORMATION')}
      ${rw('AGENCY ID',ipt(g(0))+' <button class="btn xs">계좌변경</button>','ACCOUNT',ipt(g(0)+' USD ACCOUNT'))}
      ${rw('BANK NAME',ipt('CHINABANK USD ACCOUNT'),'NATIONALITY',`<div class="smi-rg">${natR}</div>`)}
      ${rw('CONSULTANT<br><i>(수속담당자)</i>',ipt(''),'OFFICE PHONE<br><i>(담당자연락처)</i>',ipt(''))}
      ${sec('STUDENT INFORMATION')}
      ${rw('NAME',ipt(g(3,row[2])),'NAME(eng)',ipt(g(2)))}
      ${rw('Apply Date<br><i>주의! 꼭 필요시만 수정</i>',ipt(g(6),'date'),'Group/University',sel(['Select a Group','Manage Group'],'')+' <button class="btn xs">Manage</button>')}
      ${rw('AGE<br><i>Need For Group Class!</i>',ipt(g(4))+' age','SEX',`${radio('smiSex','MALE',!sexF)} &nbsp;${radio('smiSex','FEMALE',sexF)}`)}
      ${rw('BIRTHDAY<br><i>(citizen no.) ※필수</i>',ipt('','date'),'PASSPORT NUMBER',`<input id="smiPass" class="smi-i" value="0" autocomplete="off"><span id="smiPassChk" class="smi-chk"></span>`)}
      ${rw('DEPARTURE DATE',ipt(g(7),'date')+' <button class="btn xs">PERIOD CALC</button>','PICKUP SCHEDULE<br><i>(AIRLINE INFO)</i>',`<div class="smi-fl"><input id="smiFlight" class="smi-i smi-pick" placeholder="예 PR489 01:15am(8day) — 등록 가능" value="${esc(flight)}"><button class="btn xs" id="smiFlightLive" title="편명 실시간 조회">🔄 실시간</button></div>${flightPrev?`<div class="smi-prev">변경전: <b>${esc(flightPrev)}</b></div>`:''}<div id="smiFlightMsg" class="smi-flmsg"></div>`)}
      ${rw('PERIOD<br><i>입/퇴실 변경시 기숙사 재설정 필수</i>',`${ipt(g(8),'date')} ~ ${ipt(g(9),'date')} &nbsp;(<b>${wk}</b> weeks)`,'PICKUP DATE<br><i>(픽업일)</i>',`<input class="smi-i smi-pick" type=date value="${esc(pick)}">`)}
      ${rw('Medical History<br><i>(건강상태)</i>',`${radio('smiMed','없음',true)} ${radio('smiMed','있음',false)} <span style="color:var(--dim);font-size:11px">Medical Condition: not specified</span>`,'Parents Agreement<br><i>(부모님 동의서)</i>','<span style="color:var(--dim)">not specified</span>')}

// ─── 십자 안내선 (마우스 휠/가운데 클릭 토글) — 날짜·학생 추적 ───
(function(){
  let on=false;
  const v=el('div','xh-line xh-v'),h=el('div','xh-line xh-h'),tip=el('div','xh-tip'),hint=el('div','xh-hint','십자선 ON · 셀 위로 이동하면 날짜·학생 표시 · 휠클릭/Esc 종료');
  [v,h,tip,hint].forEach(x=>{x.style.display='none';document.body.appendChild(x);});
  function move(e){
    const u=document.elementFromPoint(e.clientX,e.clientY);
    const dc=u&&u.closest&&u.closest('.gantt td.dcell');
    if(!dc){v.style.display=h.style.display=tip.style.display='none';return;}
    const r=dc.getBoundingClientRect();
    v.style.left=(r.left+r.width/2)+'px';v.style.display='block';
    h.style.top=(r.top+r.height/2)+'px';h.style.display='block';
    const tr=dc.closest('tr');const name=(tr.querySelector('.name')||{}).textContent||'';
    let room=(tr.querySelector('.rno')||{}).textContent||'';if(!room){const bl=dc.closest('tbody.room-block');if(bl)room=(bl.querySelector('.rno')||{}).textContent||'';}
    tip.innerHTML=`📅 ${dc.dataset.date||''}${room?' · 🏠 '+room:''}${name?' · 👤 '+name:''}`;
    tip.style.display='block';
    let lx=e.clientX+16;if(lx+tip.offsetWidth>innerWidth-8)lx=e.clientX-tip.offsetWidth-16;
    tip.style.left=lx+'px';tip.style.top=(e.clientY+18)+'px';}
  function set(s){on=s;
    document.querySelectorAll('.twrap.dorm-scroll').forEach(t=>t.style.cursor=on?'crosshair':'');
    hint.style.display=on?'block':'none';
    if(on)document.addEventListener('mousemove',move);
    else{document.removeEventListener('mousemove',move);v.style.display=h.style.display=tip.style.display='none';}}
  document.addEventListener('mousedown',e=>{if(e.button===1&&e.target.closest&&e.target.closest('.gantt')){e.preventDefault();set(!on);}});
  document.addEventListener('auxclick',e=>{if(e.button===1&&e.target.closest&&e.target.closest('.gantt'))e.preventDefault();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&on)set(false);});
})();

<!-- ═══════════════════════════════════════════════════════════════════════
     관리자 로그인 게이트 (자기완결 · 인라인 · 외부리소스 없음)
     - 프로토타입 정적 HTML 의 <body> 아무 곳에나 통째로 붙여넣기.
     - 페이지 로드시 풀스크린 오버레이 로그인. 4계정(admin1/admin2/master/manager).
       초기 비밀번호 = 아이디. 최초 로그인 후 비밀번호 변경 강제(새 비번 ≠ 아이디).
     - 세션은 sessionStorage. 진입 후 우상단 "내 로그 다운로드" 버튼.
     - 검증 우선순위:
         (1) window.SUPA_URL + window.SUPA_ANON 이 있으면

       ※ 현재 프로토타입은 Supabase 미연동(anon 키 없음) 상태 → 기본적으로 (2) 폴백으로 동작.
          실제 연동 시 상단 <script> 에서 window.SUPA_URL / window.SUPA_ANON 만 세팅하면 (1) 사용.
     - 기존 스크립트와 충돌 방지: IIFE, 모든 id/class 접두사 'adminAuth'.
     ═══════════════════════════════════════════════════════════════════════ -->

    font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;}
  .adminAuth-btn:hover{background:#1d4ed8;}
  .adminAuth-msg{min-height:16px;margin-top:10px;font-size:12px;text-align:center;color:#dc2626;}
  .adminAuth-msg.adminAuth-ok{color:#16a34a;}
  .adminAuth-hint{margin-top:14px;font-size:11px;color:#94a3b8;text-align:center;line-height:1.5;}
  #adminAuthBar{position:fixed;bottom:14px;right:14px;z-index:2147482000;display:none;align-items:center;gap:10px;
    padding:7px 13px;background:rgba(15,23,42,.92);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:.92;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;}
  #adminAuthBar:hover{opacity:1}
  #adminAuthBar.adminAuth-show{display:flex;}
  #adminAuthBar .adminAuth-who{color:#e2e8f0;font-size:12px;}
  #adminAuthBar .adminAuth-who b{color:#fff;}
  #adminAuthBar button{border:0;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;}
  #adminAuthDownload{background:#0ea5e9;color:#fff;}
  #adminAuthLogout{background:#334155;color:#e2e8f0;}
</style>

<div id="adminAuthOverlay">
  <div class="adminAuth-card">
    <h1 class="adminAuth-title">관리자 로그인</h1>
    <p class="adminAuth-sub" id="adminAuthCardSub">SMEAG 기숙사 예약 관리</p>

    <!-- 로그인 폼 -->
    <form id="adminAuthLoginForm" autocomplete="off">
      <div class="adminAuth-field">
        <label for="adminAuthUser">아이디</label>
        <input id="adminAuthUser" type="text" autocomplete="username" />
      </div>
      <div class="adminAuth-field">
        <label for="adminAuthPass">비밀번호</label>
        <input id="adminAuthPass" type="password" autocomplete="current-password" />
      </div>
      <button class="adminAuth-btn" type="submit">로그인</button>
      <div class="adminAuth-msg" id="adminAuthLoginMsg"></div>
      <div class="adminAuth-hint">계정: admin1 · admin2 · master · manager<br>초기 비밀번호는 아이디와 동일합니다.</div>
    </form>

    <!-- 비밀번호 변경 폼(최초 로그인/must_change 시) -->
    <form id="adminAuthChangeForm" autocomplete="off" style="display:none;">
      <div class="adminAuth-field">
        <label for="adminAuthNew">새 비밀번호 (아이디와 다르게)</label>
        <input id="adminAuthNew" type="password" autocomplete="new-password" />
      </div>
      <div class="adminAuth-field">
        <label for="adminAuthNew2">새 비밀번호 확인</label>
        <input id="adminAuthNew2" type="password" autocomplete="new-password" />
      </div>
      <button class="adminAuth-btn" type="submit">비밀번호 변경 후 진입</button>
      <div class="adminAuth-msg" id="adminAuthChangeMsg"></div>
    </form>
  </div>
</div>

<div id="adminAuthBar">
  <span class="adminAuth-who">관리자 <b id="adminAuthBarWho"></b></span>
  <button id="adminAuthDownload" type="button">내 로그 다운로드</button>
  <button id="adminAuthLogout" type="button">로그아웃</button>
</div>

<script>
(function(){
  "use strict";

  // ── 설정 ────────────────────────────────────────────────────────────
  var USERS = ["admin1","admin2","master","manager"];
  var SS_KEY = "adminAuthSession";      // sessionStorage: 현재 세션
  var LS_PW  = "adminAuthPwStore";      // localStorage: {user: {hash, must_change}} (폴백)
  var LS_LOG = "adminAuthLog";          // localStorage: [{username,action,detail,at}]

  // Supabase 연동 여부. 프로토타입은 미연동(anon 키 없음)이라 폴백으로 동작.
  // 실제 연동 시 상단에서 window.SUPA_URL / window.SUPA_ANON 만 세팅하면 서버(app.admin_login) 사용.
  function supaReady(){ return !!(window.SUPA_URL && window.SUPA_ANON); }

  // ── 간이 해시(폴백 전용) ────────────────────────────────────────────
  // ※ 주의: 아래는 데모용 비암호학적 해시(djb2 변형 + 솔트)입니다.
  //   실제 인증 강도는 Supabase app.admin_login(bcrypt) 연동 시 확보됩니다.
  function weakHash(str){
    var h = 5381, s = "adminAuth$salt$";
    var v = s + String(str);
    for (var i=0;i<v.length;i++){ h = ((h<<5)+h) ^ v.charCodeAt(i); h = h>>>0; }
    return ("00000000"+h.toString(16)).slice(-8);
  }

  // ── 저장소 헬퍼 ─────────────────────────────────────────────────────
  function readJSON(store, key, def){
    try { var v = store.getItem(key); return v ? JSON.parse(v) : def; }
    catch(e){ return def; }
  }
  function writeJSON(store, key, obj){
    try { store.setItem(key, JSON.stringify(obj)); } catch(e){}
  }
  function pwStore(){ return readJSON(localStorage, LS_PW, {}); }
  function savePwStore(o){ writeJSON(localStorage, LS_PW, o); }

  // 폴백 계정 상태 초기화: 최초엔 비번=아이디, must_change=true
  function fallbackRecord(user){
    var st = pwStore();
    if (!st[user]){
      st[user] = { hash: weakHash(user), must_change: true };
      savePwStore(st);
    }
    return st[user];
  }

  // ── Supabase RPC 호출 ───────────────────────────────────────────────
  function rpc(fn, body){
    return fetch(window.SUPA_URL.replace(/\/+$/,"") + "/rest/v1/rpc/" + fn, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey": window.SUPA_ANON,
        "Authorization": "Bearer " + window.SUPA_ANON
      },
      body: JSON.stringify(body || {})
    }).then(function(r){
      if(!r.ok) throw new Error("rpc http "+r.status);
      return r.json();
    });
  }

  // ── 로그 기록 ───────────────────────────────────────────────────────
  function logLocal(user, action, detail, kind){
    var arr = readJSON(localStorage, LS_LOG, []);
    arr.push({ username:user, kind:kind||null, action:action, detail:detail||{}, at:new Date().toISOString() });
    // 과다 방지: 최근 5000건 유지
    if (arr.length > 5000) arr = arr.slice(arr.length-5000);
    writeJSON(localStorage, LS_LOG, arr);
  }
  // 진입 후 동작 기록. kind=create/read/update/delete/auth.
  //   CRUD(쓰기)는 즉시, 조회(read)는 호출측에서 화면 열람 단위·비차단으로.
  //   Supabase app.admin_log 가능하면 시도(실패해도 무시), 항상 로컬 append.
  function adminLog(action, detail, kind){
    var s = session();
    if(!s) return;
    logLocal(s.username, action, detail, kind);
    if (supaReady()){
      rpc("admin_log", { p_user:s.username, p_action:action, p_detail:detail||{}, p_kind:kind||null })["catch"](function(){});
    }
  }
  // 외부 스크립트에서 메뉴 이동 등을 기록할 수 있게 전역 훅 노출(선택).
  window.adminAuthLog = adminLog;

  // ── 세션 ────────────────────────────────────────────────────────────
  function session(){ return readJSON(sessionStorage, SS_KEY, null); }
  function setSession(user){ writeJSON(sessionStorage, SS_KEY, { username:user, since:new Date().toISOString() }); }
  function clearSession(){ try{ sessionStorage.removeItem(SS_KEY); }catch(e){} }

  // ── DOM ─────────────────────────────────────────────────────────────
  var overlay   = document.getElementById("adminAuthOverlay");
  var loginForm = document.getElementById("adminAuthLoginForm");
  var changeForm= document.getElementById("adminAuthChangeForm");
  var elUser    = document.getElementById("adminAuthUser");
  var elPass    = document.getElementById("adminAuthPass");
  var elNew     = document.getElementById("adminAuthNew");
  var elNew2    = document.getElementById("adminAuthNew2");
  var loginMsg  = document.getElementById("adminAuthLoginMsg");
  var changeMsg = document.getElementById("adminAuthChangeMsg");
  var bar       = document.getElementById("adminAuthBar");
  var barWho    = document.getElementById("adminAuthBarWho");

  var pending = null; // 변경 폼 진행 중인 사용자/비번 컨텍스트

  function showMsg(el, text, ok){
    el.textContent = text || "";
    el.className = "adminAuth-msg" + (ok ? " adminAuth-ok" : "");
  }
  function showLogin(){
    loginForm.style.display = "";
    changeForm.style.display = "none";
    overlay.classList.remove("adminAuth-hidden");
    bar.classList.remove("adminAuth-show");
    showMsg(loginMsg,""); showMsg(changeMsg,"");
    setTimeout(function(){ elUser.focus(); }, 30);
  }
  function showChange(user, oldPw){
    pending = { user:user, oldPw:oldPw };
    loginForm.style.display = "none";
    changeForm.style.display = "";
    overlay.classList.remove("adminAuth-hidden");
    showMsg(changeMsg, "최초 로그인입니다. 비밀번호를 변경하세요.", false);
    setTimeout(function(){ elNew.focus(); }, 30);
  }
  function enter(user){
    setSession(user);
    overlay.classList.add("adminAuth-hidden");
    barWho.textContent = user;
    bar.classList.add("adminAuth-show");
    adminLog("enter", { page: location.pathname });
  }

  // ── 로그인 처리 ─────────────────────────────────────────────────────
  function doLoginFallback(user, pw){
    var rec = fallbackRecord(user);
    var ok  = weakHash(pw) === rec.hash;
    logLocal(user, ok ? "login" : "login_fail", ok ? {must_change:rec.must_change} : {reason:"bad_credentials"});
    if(!ok){ showMsg(loginMsg,"아이디 또는 비밀번호가 올바르지 않습니다."); return; }
    if(rec.must_change){ showChange(user, pw); return; }
    enter(user);
  }

  loginForm.addEventListener("submit", function(ev){
    ev.preventDefault();
    var user = (elUser.value||"").trim();
    var pw   = elPass.value||"";
    if(USERS.indexOf(user) < 0){ showMsg(loginMsg,"등록되지 않은 아이디입니다."); return; }
    if(!pw){ showMsg(loginMsg,"비밀번호를 입력하세요."); return; }

    if(supaReady()){
      rpc("admin_login", { p_user:user, p_pw:pw }).then(function(res){
        if(!res || res.ok !== true){ showMsg(loginMsg, (res&&res.message)||"로그인 실패"); return; }
        if(res.must_change){ showChange(user, pw); return; }
        enter(user);
      })["catch"](function(){
        // Supabase 오류 → 폴백으로 재시도
        doLoginFallback(user, pw);
      });
    } else {
      doLoginFallback(user, pw);
    }
  });

  // ── 비밀번호 변경 처리 ──────────────────────────────────────────────
  changeForm.addEventListener("submit", function(ev){
    ev.preventDefault();
    if(!pending){ showLogin(); return; }
    var user = pending.user;
    var n1 = elNew.value||"", n2 = elNew2.value||"";
    if(n1.length < 4){ showMsg(changeMsg,"새 비밀번호는 4자 이상이어야 합니다."); return; }
    if(n1 === user){ showMsg(changeMsg,"새 비밀번호는 아이디와 달라야 합니다."); return; }
    if(n1 === pending.oldPw){ showMsg(changeMsg,"새 비밀번호는 기존 비밀번호와 달라야 합니다."); return; }
    if(n1 !== n2){ showMsg(changeMsg,"두 비밀번호가 일치하지 않습니다."); return; }

    if(supaReady()){
      rpc("admin_change_password", { p_user:user, p_old:pending.oldPw, p_new:n1 }).then(function(res){
        if(!res || res.ok !== true){ showMsg(changeMsg,(res&&res.message)||"변경 실패"); return; }
        finishChange(user);
      })["catch"](function(){
        // 폴백 저장
        changeFallback(user, n1); finishChange(user);
      });
    } else {
      changeFallback(user, n1); finishChange(user);
    }
  });

  function changeFallback(user, newPw){
    var st = pwStore();
    st[user] = { hash: weakHash(newPw), must_change:false };
    savePwStore(st);
    logLocal(user, "change_password", {});
  }
  function finishChange(user){
    elNew.value = ""; elNew2.value = ""; elPass.value = "";
    pending = null;
    enter(user);
  }

  // ── 로그 다운로드 / 로그아웃 ────────────────────────────────────────
  document.getElementById("adminAuthDownload").addEventListener("click", function(){
    var s = session(); if(!s) return;
    var all = readJSON(localStorage, LS_LOG, []);
    var mine = all.filter(function(r){ return r.username === s.username; });
    var lines = ["# usage log for " + s.username + " — exported " + new Date().toISOString()];
    mine.forEach(function(r){
      lines.push(r.at + "\t" + r.action + "\t" + JSON.stringify(r.detail||{}));
    });
    var blob = new Blob([lines.join("\n")+"\n"], { type:"text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = s.username + ".log";
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    adminLog("download_log", { count: mine.length });
  });

  document.getElementById("adminAuthLogout").addEventListener("click", function(){
    adminLog("logout", {});
    clearSession();
    elUser.value = ""; elPass.value = "";
    showLogin();
  });

  // ── 초기화: 세션 있으면 통과, 없으면 로그인 오버레이 ─────────────────
  (function init(){
    var s = session();
    if(s && USERS.indexOf(s.username) >= 0){
      overlay.classList.add("adminAuth-hidden");
      barWho.textContent = s.username;
      bar.classList.add("adminAuth-show");
    } else {
      showLogin();
    }
  })();

})();
</script>
